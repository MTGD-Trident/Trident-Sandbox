// Random but rule-legal deck: fills the Main Faction first (up to a
// comfortable target above the 40-card minimum), then splashes the rest
// from other factions/Factionless — respecting copy caps, the Unique cap,
// the Mythic cap, and the "off-faction Unique ≤ Main Faction Unique" ratio
// at every step, so the result is always a valid, confirmable deck.
function autoBuildDeck(playerNum) {
  const mainFaction = playerNum === 1 ? builder.p1Faction : builder.p2Faction;
  const picks = {};
  let total = 0, mainCount = 0, uniqueCount = 0, mainFactionUniqueCount = 0, otherFactionUniqueCount = 0;

  function tryAdd(card, wantQty) {
    const cap = maxCopiesFor(card);
    const current = picks[card.id] || 0;
    let addQty = Math.min(wantQty, cap - current, DECK_SIZE - total);
    if (addQty <= 0) return 0;
    if (card.isUnique) {
      addQty = Math.min(addQty, MAX_UNIQUE_CARDS - uniqueCount);
      if (card.faction !== mainFaction && card.faction !== 'Factionless') {
        addQty = Math.min(addQty, mainFactionUniqueCount - otherFactionUniqueCount);
      }
      if (addQty <= 0) return 0;
    }
    picks[card.id] = current + addQty;
    total += addQty;
    if (card.faction === mainFaction) mainCount += addQty;
    if (card.isUnique) {
      uniqueCount += addQty;
      if (card.faction === mainFaction) mainFactionUniqueCount += addQty;
      else if (card.faction !== 'Factionless') otherFactionUniqueCount += addQty;
    }
    return addQty;
  }

  const mainTarget = Math.min(DECK_SIZE, MIN_MAIN_FACTION + 5);
  const mainPool = shuffle(CARDS.filter(c => c.faction === mainFaction));
  mainPool.forEach(c => { if (mainCount < mainTarget) tryAdd(c, Math.min(3, mainTarget - mainCount)); });
  let guard = 0;
  while (mainCount < MIN_MAIN_FACTION && guard < 1000) {
    tryAdd(mainPool[Math.floor(Math.random() * mainPool.length)], 1);
    guard++;
  }

  const splashPool = shuffle(CARDS.filter(c => c.faction !== mainFaction));
  guard = 0;
  let idx = 0;
  while (total < DECK_SIZE && guard < 3000) {
    tryAdd(splashPool[idx % splashPool.length], Math.min(3, DECK_SIZE - total));
    idx++;
    guard++;
  }

  if (playerNum === 1) builder.p1Picks = picks; else builder.p2Picks = picks;
  renderSetup();
}

function confirmDeck(playerNum) {
  const mainFaction = playerNum === 1 ? builder.p1Faction : builder.p2Faction;
  const picks = playerNum === 1 ? builder.p1Picks : builder.p2Picks;
  if (!validateDeckPicks(picks, mainFaction).valid) return; // guard — button is disabled anyway
  if (playerNum === 1) {
    builder.step = 'p2faction';
    renderSetup();
  } else {
    startGameWithDecks(builder.p1Faction, builder.p1Picks, builder.p2Faction, builder.p2Picks);
  }
}

function renderHand(pIdx) {

  let html = '<div class="handwrap">';
  p.hand.forEach((inst, i) => {
    const off = i - (n - 1) / 2;
    const transform = 'translateX(' + (off * step) + 'px) rotate(' + (off * angle) + 'deg) translateY(' + (Math.abs(off) * 4) + 'px)';
    if (!active) {
      html += '<div class="handcard" style="transform:' + transform + ';z-index:' + (10 + i) + ';cursor:default">' + cardBackHtml() + '</div>';
    } else {
      const sel = tapState && tapState.instanceId === inst.instanceId;
      html += '<div class="handcard' + (sel ? ' selected' : '') + '" data-inst="' + inst.instanceId + '" data-rot="' + (off * angle) + '" style="transform:' + transform + (sel ? ' translateY(-28px)' : '') + ';z-index:' + (sel ? 60 : 10 + i) + (ANIM.hidden.has(inst.instanceId) ? ';visibility:hidden' : '') + '" draggable="true" ' +
        'ondragstart="onHandDragStart(event,' + pIdx + ',' + i + ')" ondragend="onDragEndAny(event)" ' +
        'onclick="onCardTap(\'' + inst.instanceId + '\')">' + establishedCardHtml(inst.cardId, { width: 175 }) + '</div>';
    }
  });
  html += '</div>';
  return html;
}

function renderInspectModal() {
  if (!tapState || tapState.stage !== 2) return '';
  // Find the card instance anywhere it might currently be — hand or board, either player.
  let cardId = null;
  for (const p of state.players) {
    const hit = p.hand.find(c => c.instanceId === tapState.instanceId) ||
      p.rows.Unit.find(c => c && c.instanceId === tapState.instanceId) ||
      p.rows.Location.find(c => c && c.instanceId === tapState.instanceId);
    if (hit) { cardId = hit.cardId; break; }
  }
  if (!cardId) { tapState = null; return ''; }
  const st = SCRIPT_STATUS[cardId];
  const stText = { auto: 'Ability automated', partial: 'Ability partly automated \u2014 resolve the rest by hand', manual: 'Ability not automated \u2014 resolve it by hand', none: '' }[st] || '';
  return '<div class="inspect-backdrop" onclick="closeInspect()">' +
    '<div class="inspect-card-wrap" onclick="event.stopPropagation(); onCardTap(\'' + tapState.instanceId + '\')">' +
    establishedCardHtml(cardId, { width: 900 }) + '</div>' +
    (stText ? '<div class="auto-status ' + st + '">' + stText + '</div>' : '') + '</div>';
}

function renderConflictBanner() {
  if (state.gameOver) {
    const winner = state.players[state.gameOver.winnerIdx];
    return '<div class="conflict-banner game-over">🏆 ' + winner.name + ' wins the game! (' +
      state.roundWins[0] + '–' + state.roundWins[1] + ' rounds)</div>';
  }
  if (!state.lastRoundResult) return '';
  const r = state.lastRoundResult;
  let resultText;
  if (r.winnerIdx === null) {
    resultText = 'Round ' + r.roundNumber + ' tied at ' + r.totals[0] + ' Power each. ';
  } else {
    const winner = state.players[r.winnerIdx];
    resultText = winner.name + ' won round ' + r.roundNumber + ' — ' + Math.max(r.totals[0], r.totals[1]) + ' Power to ' + Math.min(r.totals[0], r.totals[1]) + '. ';
  }
  if (r.tieNote) resultText += r.tieNote + ' ';
  return '<div class="conflict-banner">' + resultText +
    'Score: ' + r.roundWins[0] + '–' + r.roundWins[1] + '. Units retired, Locations held, both players drew a fresh 5 — ' +
    state.players[state.active].name + ' starts round ' + state.roundNumber + '.</div>';
}
function renderTopBar() {
  const active = state.players[state.active];
  const opp = state.players[state.active === 0 ? 1 : 0];
  return '<div class="topbar">' +
    '<div class="topbar-group">' +
      '<div class="infopanel">' + esc(state.players[1].name) + '</div>' +
      '<div class="infopanel">Hand: ' + state.players[1].hand.length + '</div>' +
    '</div>' +
    '<div class="topbar-center">' +
      '<div class="infopanel center">' + (active === state.players[0] ? "Player 1's Turn" : "Player 2's Turn") + '</div>' +
      '<div class="row"><div class="infopanel center">Round ' + state.roundNumber + '</div>' +
      '<div class="infopanel center">Score ' + state.roundWins[0] + '\u2013' + state.roundWins[1] + '</div></div>' +
    '</div>' +
    '<div class="topbar-right">' +
      '<div class="infopanel settings-btn" onclick="openSettings()">\u2699 Settings</div>' +
      '<div class="infopanel end-game" onclick="newGame()">End Game</div>' +
    '</div>' +
  '</div>';
}

function phaseText() {
  if (state.pending) return 'Ability waiting \u2014 see below';
  const st = turnStatus(state.active);
  if (st.ready) return 'Actions done \u2014 End Turn when ready';
  const p = state.players[state.active];
  const left = [];
  if (!st.playsDone) { const n = MAX_PLAYS_PER_TURN - p.cardsPlayedThisTurn; left.push(n + ' play' + (n === 1 ? '' : 's')); }
  if (!st.drawDone) left.push('1 draw');
  return 'Still to do \u2014 ' + left.join(', ');
}
function renderLog() {
  const log = (state.log || []).slice(-2);
  return '<div class="action-log">' + (log.length ? log.map(esc).join(' \u00b7 ') : '&nbsp;') + '</div>';
}
// Keyword definitions (from the faction pages on Confluence), shown in ability prompts.
const KEYWORD_TEXT = {
  'Warcry': 'Whenever you play a Unit, you may have each other Unit you control get +1 Power.',
  'Onslaught': "When this Unit enters play, if you control 3 or more Units, you may have each opponent's Units get -2 Power.",
  'Consensus': 'Whenever a Unit you control is Retired, you may have each other Unit you control get +1 Power.',
  'Duty': 'If this Unit would be Retired, you may shuffle it into its owner\'s Deck instead.',
  'High Stakes': 'Reveal the top card of your Deck. If it is a Unit, this Unit gets +3 Power. If not, Retire it and this Unit gets -1 Power.',
  'Scrap Value': 'When this Unit enters play, you may Erase a card from any Retirement Pile. This Unit gets +1 Power for each card Erased this way.',
  'Switch': 'When this Unit leaves play, you may search your Deck for a Unit with higher Power, shuffle, and put it on top.',
  'Acquisition': 'Whenever you discard a card, you may draw a card.',
  'Root Bond': "Whenever you play a Unit at this Location's stationed slot, this Location gains +1 Power.",
};
function pendingCardId(pd) {
  const t = pd.task || {};
  if (t.kind === 'duty') {
    const inst = (state.players[t.controller].limbo || []).find(x => x.instanceId === t.src);
    return inst ? inst.cardId : null;
  }
  return t.cardId || null;
}
function renderPrompt() {
  const pd = state.pending;
  if (!pd) return '';
  const cid = pendingCardId(pd);
  let how = '', btns = '';
  if (pd.type === 'confirm') btns = '<button class="primary" onclick="answerPending(true)">Yes</button><button onclick="answerPending(false)">No</button>';
  else if (pd.type === 'target') { how = 'Tap a glowing card on the board.'; if (pd.optional) btns = '<button onclick="answerPending(false)">Skip</button>'; }
  else if (pd.type === 'list') how = 'Make your choice in the window above.';
  const ab = pd.task && pd.task.ab !== undefined && cid ? scriptsOf(cid)[pd.task.ab] : null;
  const kw = pd.task && pd.task.kind === 'duty' ? 'Duty' : (ab && ab.source !== 'text' ? ab.source : null);
  const detail = kw && KEYWORD_TEXT[kw] ? kw + ' \u2014 ' + KEYWORD_TEXT[kw] : (pd.detail || (cid && CARD_BY_ID[cid] ? CARD_BY_ID[cid].ability : ''));
  return '<div class="prompt-panel">' +
    (cid ? '<div class="pp-card">' + establishedCardHtml(cid, { width: 150 }) + '</div>' : '') +
    '<div class="pp-body"><div class="pp-text">' + esc(pd.text) + '</div>' +
    (how ? '<div class="pp-how">' + how + '</div>' : '') +
    (detail ? '<div class="pp-detail">' + esc(detail) + '</div>' : '') +
    (btns ? '<div class="pp-btns">' + btns + '</div>' : '') + '</div></div>';
}
function renderPickModal() {
  const pd = state && state.pending;
  if (!pd || pd.type !== 'list') return '';
  const cards = pd.options.map(id => (findAnywhere(id) || {}).inst).filter(Boolean);
  let html = '<div class="inspect-backdrop pick-backdrop"><div class="pick-panel">' +
    '<div class="pick-title">' + esc(pd.text) + '</div><div class="pick-row">';
  const infoOnly = pd.max === 0;
  html += '<div class="pile-sub">' + (infoOnly ? 'Tap a card to enlarge it' : 'Tap to choose \u00b7 \ud83d\udd0d to enlarge') + '</div>';
  cards.forEach(inst => {
    const sel = pd.selected.includes(inst.instanceId);
    html += '<div class="pick-card' + (sel ? ' picked' : '') + '" onclick="' +
      (infoOnly ? 'zoomPick(\'' + inst.cardId + '\')' : 'togglePick(\'' + inst.instanceId + '\')') + '">' +
      establishedCardHtml(inst.cardId, { width: 150 }) +
      '<button class="zoom-btn" aria-label="Enlarge card" onclick="event.stopPropagation(); zoomPick(\'' + inst.cardId + '\')">\ud83d\udd0d</button></div>';
  });
  html += '</div><div class="pick-actions">';
  if (pd.max === 0) html += '<button class="primary" onclick="answerPending(true)">Continue</button>';
  else {
    const ok = pd.selected.length >= pd.min;
    html += '<button class="primary" ' + (ok ? '' : 'disabled') + ' onclick="answerPending(true)">Confirm</button>';
    if (pd.min === 0) html += '<button onclick="answerPending(false)">Skip</button>';
  }
  html += '</div></div></div>';
  if (pickZoom) html += '<div class="inspect-backdrop" style="z-index:950" onclick="zoomPick(null)"><div class="inspect-card-wrap">' +
    establishedCardHtml(pickZoom, { width: 900 }) + '</div></div>';
  return html;
}
let pickZoom = null; // card enlarged from the choice window (UI only, not saved)
function zoomPick(cardId) { pickZoom = cardId; if (cardId) sfx('tap'); render(); }
function dismissPendingReveal() {
  state.pendingReveal = null;
  render();
}

const SAVE_KEY = 'trident_v3_save_1';

function saveState() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ state })); } catch (e) {}
}
function loadState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    return parsed && parsed.state ? parsed : null;
  } catch (e) { return null; }
}
function clearSavedState() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
}
function newGame() {
  state = null;
  builder = null;
  tapState = null;
  clearSavedState();
  render();
}

function fitToScreen() {
  const wrapper = document.getElementById('scale-wrapper');
  if (!wrapper) return;
  wrapper.style.zoom = 1;
  const naturalHeight = wrapper.scrollHeight;
  const naturalWidth = wrapper.scrollWidth || 900;
  // Measure the space inside #app, which is padded clear of the system bars.
  const app = document.getElementById('app');
  const cs = window.getComputedStyle ? getComputedStyle(app) : null;
  const pad = k => cs ? parseFloat(cs[k]) || 0 : 0;
  const availH = (app.clientHeight || window.innerHeight) - pad('paddingTop') - pad('paddingBottom') - 8;
  const availW = (app.clientWidth || window.innerWidth) - pad('paddingLeft') - pad('paddingRight') - 8;
  const scale = Math.min(availH / naturalHeight, availW / naturalWidth, 1.8);
  // zoom (not transform: scale) — transform is purely a paint-time visual
  // effect and is known to break HTML5 drag-and-drop hit-testing in some
  // Chromium/WebView versions, since drop-target coordinates don't always
  // correctly account for a scaled ancestor. zoom affects real layout, so
  // drag coordinates stay correct. Non-standard CSS, but well-supported in
  // the Chromium-based WebView this actually runs in.
  wrapper.style.zoom = scale;
}
window.addEventListener('resize', fitToScreen);

function render() {
  const app = document.getElementById('app');

  if (!state) {
    app.className = 'setup-mode';
    renderSetup();
    return;
  }
  app.className = '';

  if (state.pendingReveal !== null) {
    const name = state.players[state.pendingReveal].name;
    app.innerHTML = '<div id="scale-wrapper"><div class="pass-screen">' +
      '<p class="pass-title">Pass the device to ' + esc(name) + '</p>' +
      '<p class="pass-sub">The other player should look away \u2014 this hides their hand until you tap continue.</p>' +
      '<button class="setup-row button primary" style="padding:10px 20px;border-radius:8px" onclick="dismissPendingReveal()">I\'m ' + esc(name) + ' \u2014 continue</button>' +
      '<button class="setup-settings" style="position:static;margin-top:6px" onclick="openSettings()">\u2699 Settings</button>' +
      '</div></div>';
    fitToScreen();
    saveState();
    return;
  }

  let html = renderTopBar();
  html += renderConflictBanner();
  html += renderLog();
  html += renderOpponentSide(state.active === 0 ? 1 : 0);
  html += '<div class="phasebar"><div class="line"></div><div class="lbl">' + phaseText() + '</div><div class="line r"></div></div>';
  html += renderPlayerSide(state.active);
  html += '<div class="hand-row">' + (state.pending ? renderPrompt() : renderHand(state.active)) + renderSideExtra(state.active) + '</div>';

  const modalHtml = renderInspectModal(); // computed once — may null out tapState if the card vanished
  app.innerHTML = '<div id="scale-wrapper">' + html + '</div>' + modalHtml + renderPickModal() + renderPileModal();
  if (ANIM.queue.length && typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(() => requestAnimationFrame(runAnims));
  fitToScreen();
  autoFitCardText(app); // shrink each card's text to actually fit its box, now that real layout exists
  saveState();
}

(function initFromSave() {
  const saved = loadState();
  initFx();
  if (saved) { state = upgradeState(saved.state); }
  render();
})();
</script>
