<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Trident Sandbox</title>
<style>
  :root {
    --surface-0: #f7f7f5; --surface-1: #ffffff; --surface-2: #f0f0ee;
    --text-primary: #1a1a1a; --text-secondary: #666666; --text-muted: #999999;
    --border: #dddddd; --border-strong: #bbbbbb;
    --font-sans: -apple-system, Roboto, Helvetica, Arial, sans-serif;
  }
  html, body {
    margin: 0; padding: 12px; background: var(--surface-0);
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<style>
  #app { max-width: 1100px; margin: 0 auto; font-family: var(--font-sans, sans-serif); color: var(--text-primary, #1a1a1a); }
  .setup-row { display: flex; gap: 16px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .card-list { max-height: 420px; overflow-y: auto; border: 1px solid var(--border, #ddd); border-radius: 8px; margin-bottom: 12px; }
  .card-row { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-bottom: 1px solid var(--border, #eee); font-size: 13px; }
  .card-row:last-child { border-bottom: none; }
  .card-row:hover { background: var(--surface-2, #f5f5f5); }
  .card-row-name { flex: 1; }
  .card-row-meta { color: var(--text-secondary, #777); font-size: 12px; white-space: nowrap; }
  .qty-stepper { display: flex; align-items: center; gap: 6px; }
  .qty-stepper button { padding: 2px 9px; font-size: 14px; line-height: 1.4; }
  .qty-value { min-width: 14px; text-align: center; font-weight: 500; }
  .deck-count { font-size: 13px; font-weight: 500; margin-bottom: 8px; }
  .deck-count.invalid { color: #c0392b; }
  .deck-errors { font-size: 12px; color: #c0392b; margin-bottom: 10px; }
  select, button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border, #ccc); background: var(--surface-1, #fff); color: var(--text-primary, #1a1a1a); cursor: pointer; }
  button.primary { background: #3B4A8F; color: white; border: none; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  h1 { font-size: 22px; font-weight: 500; margin-bottom: 4px; }
  .sub { color: var(--text-secondary, #666); margin-bottom: 20px; font-size: 14px; }
  .board { display: flex; flex-direction: column; gap: 6px; }
  .player-zone { border: 1px solid var(--border, #ddd); border-radius: 12px; padding: 12px; background: var(--surface-1, #fafafa); }
  .player-zone.active { border-color: #3B4A8F; box-shadow: 0 0 0 2px #3B4A8F33; }
  .zone-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .zone-header strong { font-size: 15px; }
  .total-power { font-size: 14px; font-weight: 600; padding: 3px 10px; border-radius: 6px; background: var(--surface-2, #eee); color: var(--text-primary, #1a1a1a); }
  .turn-status { font-size: 12px; color: var(--text-secondary, #666); }
  .pile-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .pile { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .pile-stack { width: 54px; height: 76px; border-radius: 6px; border: 1px solid var(--border, #999); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; cursor: pointer; background: var(--surface-2, #eee); }
  .pile-label { font-size: 11px; color: var(--text-secondary, #777); }
  .lanes { display: flex; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
  @media (max-width: 480px) {
    .slot { width: 100px; min-height: 120px; }
    .card { width: 100px; font-size: 11px; }
    .card-ability { font-size: 10px; min-height: 30px; }
    .lanes { gap: 6px; }
    .hand { gap: 6px; }
  }
  .lane { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .lane-label { font-size: 10px; color: var(--text-secondary, #777); text-transform: uppercase; letter-spacing: 0.04em; }
  .slot { width: 130px; min-height: 150px; border: 2px dashed var(--border, #ccc); border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 4px; }
  .slot.filled { border-style: solid; padding: 0; }
  .slot.drag-valid { border-color: #2f9e44; background: #2f9e4422; }
  .slot.drag-invalid { border-color: #c0392b; background: #c0392b11; }
  .pile-stack.drag-valid { border-color: #2f9e44; background: #2f9e4433; box-shadow: 0 0 0 2px #2f9e4455; }
  .pile-stack.drag-invalid { border-color: #c0392b; background: #c0392b22; }
  .hand > div[draggable="true"] { cursor: grab; }
  .hand > div[draggable="true"]:active { cursor: grabbing; }
  .hand { display: flex; gap: 8px; flex-wrap: wrap; min-height: 150px; }
  .card { width: 130px; border-radius: 8px; overflow: hidden; cursor: pointer; border: 1px solid rgba(0,0,0,0.15); font-size: 12px; background: var(--surface-2, #fff); transition: transform .1s; }
  .card:hover { transform: translateY(-3px); }
  .card-name-bar { padding: 6px 8px; font-weight: 500; color: white; display: flex; justify-content: space-between; align-items: center; gap: 4px; }
  .card-power { background: rgba(0,0,0,0.35); border-radius: 4px; padding: 1px 6px; font-size: 12px; }
  .card-sub { padding: 3px 8px; font-size: 10px; color: var(--text-secondary, #666); background: var(--surface-1, #f2f2f2); }
  .card-ability { padding: 6px 8px; font-size: 11px; line-height: 1.35; color: var(--text-primary, #222); min-height: 40px; }
  .card-flavor { padding: 4px 8px 6px; font-size: 10px; font-style: italic; color: var(--text-muted, #888); border-top: 1px solid rgba(0,0,0,0.08); }
  .card.mini { width: 100%; height: 100%; font-size: 10px; }
  .card.mini .card-ability { display: none; }
  .card.card-back { height: 150px; display: flex; align-items: center; justify-content: center; background: repeating-linear-gradient(135deg, #3B4A8F, #3B4A8F 8px, #2c3870 8px, #2c3870 16px); border-top: none; cursor: default; }
  .card.card-back span { color: #ffffffcc; font-weight: 500; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; }
  .overlay { position: static; margin-top: 8px; padding: 10px; border: 1px solid var(--border, #ccc); border-radius: 8px; background: var(--surface-1, #fff); }
  .overlay button { margin: 2px 4px 2px 0; font-size: 12px; padding: 5px 10px; }
  .toolbar { display: flex; gap: 10px; margin: 14px 0; align-items: center; flex-wrap: wrap; }
  .empty-slot-label { font-size: 11px; color: var(--text-muted, #999); }
  .count-badge { font-size: 11px; color: var(--text-secondary, #777); }
  .retirement-list { max-height: 160px; overflow-y: auto; }
  .retirement-item { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 12px; border-bottom: 1px solid var(--border, #eee); }
  .conflict-banner { background: #3B4A8F; color: white; padding: 12px 16px; border-radius: 10px; margin-bottom: 12px; font-size: 14px; }
  .conflict-banner .count-badge { color: #ffffffaa; }
  .conflict-banner.game-over { background: #B8860B; font-size: 17px; font-weight: 600; text-align: center; }
  .pass-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 320px; gap: 10px; }
  .pass-title { font-size: 22px; font-weight: 500; margin: 0; }
  .pass-sub { color: var(--text-secondary, #666); font-size: 14px; margin: 0 0 12px; }
</style>
<script>

 "rarity": "Legendary", "isUnique": false}, {"id": "006", "name": "Diplomat Roselight", "type": "Unit", "subtype": "Djinn Diplomat", "power": "9", "ability": "Fury. Whenever you play a Location, you may have this Unit gain +1 Power.", "flavor": "The first of his kind in Spiria's halls of power, its steadiest voice.", "faction": "DisciplesOfTheCelestia", "color": "#3B4A8F", "rarity": "Legendary", "isUnique": false}, {"id": "007", "name": "Justicar Phosene", "type": "Unit", "subtype": "Golem Justicar", "power": "11", "ability": "Duty Whenever this Unit would gain Power, it instead gains 1 less Power (minimum 0).", "flavor": "The first Golem to earn the title, and the last to abuse it.", "faction": "DisciplesOfTheCelestia", "color": "#3B4A8F", "rarity": "Legendary", "isUnique": false}, {"id": "008", "name": "Beacon Across the Rift", "type": "Event", "subtype": "Vigil", "power": "", "ability": "Return up to 2 target Units from your Retirement Pile to your hand, or search your deck for a Location card, reveal it, and put it into your hand.", "flavor": "Even lost causes find their way home, eventually.", "faction": "DisciplesOfTheCelestia", "color": "#3B4A8F", "rarity": "Legendary", "isUnique": false}, {"id": "009", "name": "Communion of Embers", "type": "Event", "subtype": "Rite", "power": "", "ability": "Each Unit you control gets +1 Power for each Unit in your Retirement Pile, until end of turn.", "flavor": "One flame, shared among the fallen and the living alike.", "faction": "DisciplesOfTheCelestia", "color": "#3B4A8F", "rarity": "Legendary", "isUnique": false}, {"id": "010", "name": "The Vigil Spire", "type": "Location", "subtype": "Watchtower", "power": "6", "ability": "Fury At the start of your turn, you may shuffle a Unit from your Retirement Pile into your deck; if you do, draw a card.", "flavor": "From its beacon, no soul is truly lost to the Decay.", "faction": "DisciplesOfTheCelestia", "color": "#3B4A8F", "rarity": "Legendary", "isUnique": false}, {"id": "011", "name": "Vow-Sworn Paladin", "type": "Unit", "subtype": "Human Paladin", "power": "7", "ability": "Duty", "flavor": "Death is a technicality to those who've surrendered their fear of it.", "faction": "DisciplesOfTheCelestia", "color": "#3B4A8F", "rarity": "Rare", "isUnique": false}, {"id": "012", "name": "Djinn Emberwarden", "type": "Unit", "subtype": "Djinn Sentinel", "power": "7", "ability": "Fury", "flavor": "It burns brightest for those it has already lost.", "faction": "DisciplesOfTheCelestia", "color": "#3B4A8F", "rarity": "Rare", "isUnique": false}, {"id": "013", "name": "Golem Vigil-Bearer", "type": "Unit", "subtype": "Golem Sentinel", "power": "8", "ability": "This Unit takes no Power loss from opposing abilities.", "flavor": "Carved from the mountain that survived the Decay's first breath.", "faction": "DisciplesOfTheCelestia", "color": "#3B4A8F", "rarity": "Rare", "isUnique": false}, {"id": "014", "name": "Pilgrim's Guide", "type": "Unit", "subtype": "Human Ranger", "power": "8", "ability": "Whenever you play a Location, you may draw a card.", "flavor": "She has walked every road twice \u2014 once to map it, once to defend it.", "faction": "DisciplesOfTheCelestia", "color": "#3B4A8F", "rarity": "Rare", "isUnique": false}, {"id": "015", "name": "Djinn Seer of the Ember Choir", "type": "Unit", "subtype": "Djinn Seer", "power": "8", "ability": "When this Unit enters play, you may look at the top 2 cards of your deck; put one in your hand and the other on the bottom.", "flavor": "The Choir does not predict the future. It insists upon a better one.", "faction": "DisciplesOfTheCelestia", "color": "#3B4A8F", "rarity": "Rare", "isUnique": false}, {"id": "016", "name": "Cleric of the Undying Hearth", "type": "Unit", "subtype": "Human Cleric", "power": "7", "ability": "Duty", "flavor": "Every wound is a lesson the Decay will not get to repeat.", "faction": "DisciplesOfTheCelestia", "color": "#3B4A8F", "rarity": "Rare", "isUnique": false}, {"id": "017", "name": " const CARD_BY_ID = {};
CARDS.forEach(c => { CARD_BY_ID[c.id] = c; });
const FACTIONS = [...new Set(CARDS.map(c => c.faction))].sort();
const ROW_TYPES = ['Unit', 'Location']; // Events never occupy a row slot

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let state = null;
let builder = null; // pre-game deck-building wizard state: { step, p1Faction, p1Selected, p2Faction, p2Selected, filter }
let uiOpen = null; // {kind:'hand'|'slot'|'retirement', player, index, rowType}
let dragSource = null; // {pIdx, handIdx, cardId, type} while a hand card is being dragged

function onHandDragStart(e, pIdx, handIdx) {
  const p = state.players[pIdx];
  const inst = p.hand[handIdx];
  const c = CARD_BY_ID[inst.cardId];
  dragSource = { pIdx, handIdx, cardId: inst.cardId, type: c.type };
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', inst.cardId); // required by some browsers to permit the drag
}

function onHandDragEnd(e) {
  dragSource = null;
  document.querySelectorAll('.slot.drag-valid, .slot.drag-invalid, .pile-stack.drag-valid, .pile-stack.drag-invalid').forEach(el => {
    el.classList.remove('drag-valid', 'drag-invalid');
  });
}

function isValidDrop(pIdx, rowType) {
  if (!dragSource) return false;
  if (state.gameOver) return false;
  if (dragSource.pIdx !== pIdx) return false; // can't play into the other player's row
  if (dragSource.pIdx !== state.active) return false; // only the active player may play
  if (state.players[dragSource.pIdx].cardsPlayedThisTurn >= MAX_PLAYS_PER_TURN) return false;
  const targetType = rowType === 'Location' ? 'Location' : 'Unit';
  return dragSource.type === targetType;
}

function isValidEventDrop(pIdx) {
  if (!dragSource) return false;
  if (state.gameOver) return false;
  if (dragSource.pIdx !== pIdx) return false; // can't play an Event into the other player's pile
  if (dragSource.pIdx !== state.active) return false; // only the active player may play
  if (state.players[dragSource.pIdx].cardsPlayedThisTurn >= MAX_PLAYS_PER_TURN) return false;
  return dragSource.type === 'Event';
}

function onPileDragOver(e, pIdx) {
  if (!isValidEventDrop(pIdx)) {
    e.currentTarget.classList.add('drag-invalid');
    return; // no preventDefault — browser shows a "not allowed" cursor
  }
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drag-valid');
}

function onPileDragLeave(e) {
  e.currentTarget.classList.remove('drag-valid', 'drag-invalid');
}

function onPileDrop(e, pIdx) {
  e.preventDefault();
  if (!isValidEventDrop(pIdx)) return;
  playEvent(dragSource.pIdx, dragSource.handIdx);
  dragSource = null;
}


function onSlotDragOver(e, pIdx, rowType, slotIdx) {
  if (!isValidDrop(pIdx, rowType)) {
    e.currentTarget.classList.add('drag-invalid');
    return; // no preventDefault — browser shows a "not allowed" cursor
  }
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drag-valid');
}

function onSlotDragLeave(e) {
  e.currentTarget.classList.remove('drag-valid', 'drag-invalid');
}

function onSlotDrop(e, pIdx, rowType, slotIdx) {
  e.preventDefault();
  if (!isValidDrop(pIdx, rowType)) return;
  playToSlot(dragSource.pIdx, dragSource.handIdx, rowType, slotIdx);
  dragSource = null;
}

function buildDeckFromPicks(picks) {
  const expanded = [];
  Object.entries(picks).forEach(([cardId, qty]) => {
    for (let i = 0; i < qty; i++) expanded.push(cardId);
  });
  const chosen = shuffle(expanded);
  return chosen.map((id, i) => ({ instanceId: id + '-' + i + '-' + Math.random().toString(36).slice(2, 7), cardId: id, power: null }));
}

const MAX_PLAYS_PER_TURN = 2;
const ROUNDS_TO_WIN_GAME = 2;

// Deck construction rules, per the Confluence "Deck Construction" page.
const DECK_SIZE = 60;
const MIN_MAIN_FACTION = 40;
const MAX_COPIES_PER_CARD = 3;
const MAX_COPIES_UNIQUE = 1;
const MAX_UNIQUE_CARDS = 3;
const MAX_COPIES_MYTHIC = 1;

function maxCopiesFor(card) {
  if (card.isUnique) return MAX_COPIES_UNIQUE;
  if (card.rarity === 'Mythic') return MAX_COPIES_MYTHIC;
  return MAX_COPIES_PER_CARD;
}

// Full legality check for a set of picks ({cardId: qty}) against a
// declared Main Faction. Returns { valid, errors[], totals... } — used to
// gate the Confirm button and to show a live checklist as you build.
function validateDeckPicks(picks, mainFaction) {
  const errors = [];
  let total = 0, mainFactionCount = 0, uniqueCount = 0, mainFactionUniqueCount = 0, otherFactionUniqueCount = 0;

  Object.entries(picks).forEach(([cardId, qty]) => {
    if (qty <= 0) return;
    const c = CARD_BY_ID[cardId];
    total += qty;
    const cap = maxCopiesFor(c);
    if (qty > cap) {
      errors.push(c.name + ': max ' + cap + ' cop' + (cap === 1 ? 'y' : 'ies') + ' allowed' + (c.isUnique ? ' (Unique)' : c.rarity === 'Mythic' ? ' (Mythic)' : ''));
    }
    if (c.faction === mainFaction) {
      mainFactionCount += qty;
      if (c.isUnique) mainFactionUniqueCount += qty;
    } else if (c.faction !== 'Factionless') {
      if (c.isUnique) otherFactionUniqueCount += qty;
    }
    if (c.isUnique) uniqueCount += qty;
  });

  if (total !== DECK_SIZE) errors.push('Deck must be exactly ' + DECK_SIZE + ' cards (currently ' + total + ')');
  if (mainFactionCount < MIN_MAIN_FACTION) errors.push('Need at least ' + MIN_MAIN_FACTION + ' cards from ' + mainFaction + ' (currently ' + mainFactionCount + ')');
  if (uniqueCount > MAX_UNIQUE_CARDS) errors.push('Max ' + MAX_UNIQUE_CARDS + ' Unique cards allowed (currently ' + uniqueCount + ')');
  if (otherFactionUniqueCount > mainFactionUniqueCount) errors.push('Off-faction Unique cards (' + otherFactionUniqueCount + ') can\'t exceed Main Faction Unique cards (' + mainFactionUniqueCount + ')');

  return { valid: errors.length === 0, errors, total, mainFactionCount, uniqueCount };
}

function startGameWithDecks(f1, picks1, f2, picks2) {
  const p1deck = buildDeckFromPicks(picks1);
  const p2deck = buildDeckFromPicks(picks2);
  state = {
    players: [
      { name: 'Player 1', faction: f1, deck: p1deck, hand: p1deck.splice(0, 5), rows: { Unit: [null, null, null], Location: [null, null, null] }, retirement: [], cardsPlayedThisTurn: 0, hasDrawnThisTurn: false },
      { name: 'Player 2', faction: f2, deck: p2deck, hand: p2deck.splice(0, 5), rows: { Unit: [null, null, null], Location: [null, null, null] }, retirement: [], cardsPlayedThisTurn: 0, hasDrawnThisTurn: false },
    ],
    active: 0,
    roundNumber: 1,
    roundStarter: 0,
    roundWins: [0, 0],
    lastRoundResult: null,
    gameOver: null,
    pendingReveal: null, // set to a player index right after a turn/round pass, to gate the "pass the device" interstitial
  };
  builder = null;
  uiOpen = null;
  render();
}

function basePower(cardId) {
  const c = CARD_BY_ID[cardId];
  const p = parseInt(c.power, 10);
  return isNaN(p) ? null : p;
}

function currentPower(inst) {
  const base = basePower(inst.cardId);
  if (base === null) return null;
  return base + (inst.power || 0);
}

function totalPower(pIdx) {
  const p = state.players[pIdx];
  let total = 0;
  ROW_TYPES.forEach(rowType => {
    p.rows[rowType].forEach(inst => {
      if (inst) total += currentPower(inst) || 0;
    });
  });
  return total;
}

function draw(pIdx) {
  if (state.gameOver) return;
  const p = state.players[pIdx];
  if (pIdx !== state.active) return; // only the active player may draw
  if (p.deck.length === 0) return;
  if (p.hasDrawnThisTurn) return; // one draw per turn
  p.hand.push(p.deck.shift());
  p.hasDrawnThisTurn = true;
  if (checkConflictTrigger()) return;
  maybeAutoEndTurn(pIdx);
  render();
}

function playToSlot(pIdx, handIdx, rowType, slotIdx) {
  if (state.gameOver) return;
  const p = state.players[pIdx];
  if (pIdx !== state.active) return; // only the active player may play
  if (p.cardsPlayedThisTurn >= MAX_PLAYS_PER_TURN) return; // play limit
  const [inst] = p.hand.splice(handIdx, 1);
  const existing = p.rows[rowType][slotIdx];
  if (existing) p.retirement.push(existing);
  p.rows[rowType][slotIdx] = inst;
  p.cardsPlayedThisTurn++;
  uiOpen = null;
  if (checkConflictTrigger()) return;
  maybeAutoEndTurn(pIdx);
  render();
}

function playEvent(pIdx, handIdx) {
  if (state.gameOver) return;
  const p = state.players[pIdx];
  if (pIdx !== state.active) return; // only the active player may play
  if (p.cardsPlayedThisTurn >= MAX_PLAYS_PER_TURN) return; // play limit
  const [inst] = p.hand.splice(handIdx, 1);
  // Events resolve immediately and don't occupy a row slot — straight to
  // the retirement pile, same as a spent Unit/Location.
  p.retirement.push(inst);
  p.cardsPlayedThisTurn++;
  uiOpen = null;
  if (checkConflictTrigger()) return;
  maybeAutoEndTurn(pIdx);
  render();
}

function returnToHand(pIdx, rowType, slotIdx) {
  if (state.gameOver) return;
  const p = state.players[pIdx];
  const inst = p.rows[rowType][slotIdx];
  if (!inst) return;
  inst.power = 0;
  p.rows[rowType][slotIdx] = null;
  p.hand.push(inst);
  // Undoing a play frees up the play count it used, so a misclick doesn't cost a turn action.
  if (pIdx === state.active && p.cardsPlayedThisTurn > 0) p.cardsPlayedThisTurn--;
  uiOpen = null;
  render();
}

function retireSlot(pIdx, rowType, slotIdx) {
  if (state.gameOver) return;
  const p = state.players[pIdx];
  const inst = p.rows[rowType][slotIdx];
  if (!inst) return;
  inst.power = 0;
  p.rows[rowType][slotIdx] = null;
  p.retirement.push(inst);
  uiOpen = null;
  render();
}

function adjustPower(pIdx, rowType, slotIdx, delta) {
  if (state.gameOver) return;
  const inst = state.players[pIdx].rows[rowType][slotIdx];
  if (!inst) return;
  inst.power = (inst.power || 0) + delta;
  render();
}

function retirementReturn(pIdx, i) {
  if (state.gameOver) return;
  const p = state.players[pIdx];
  const [inst] = p.retirement.splice(i, 1);
  inst.power = 0;
  p.hand.push(inst);
  render();
}

function maybeAutoEndTurn(pIdx) {
  if (pIdx !== state.active) return;
  const p = state.players[pIdx];
  if (p.cardsPlayedThisTurn >= MAX_PLAYS_PER_TURN && p.hasDrawnThisTurn) {
    endTurn();
  }
}

function endTurn() {
  if (state.gameOver) return;
  state.active = state.active === 0 ? 1 : 0;
  const next = state.players[state.active];
  next.cardsPlayedThisTurn = 0;
  next.hasDrawnThisTurn = false;
  uiOpen = null;
  state.pendingReveal = state.active;
  render();
}

// Returns true if a Conflict round was triggered and handled (caller should
// stop — resolveConflict() does its own render()); false otherwise.
function checkConflictTrigger() {
  if (state.players[0].hand.length === 0 && state.players[1].hand.length === 0) {
    resolveConflict();
    return true;
  }
  return false;
}

function resolveConflict() {
  const t0 = totalPower(0), t1 = totalPower(1);
  const winnerIdx = t0 === t1 ? null : (t0 > t1 ? 0 : 1);
  if (winnerIdx !== null) state.roundWins[winnerIdx]++;

  const result = {
    roundNumber: state.roundNumber,
    totals: [t0, t1],
    winnerIdx,
    roundWins: state.roundWins.slice(),
  };
  state.lastRoundResult = result;

  if (winnerIdx !== null && state.roundWins[winnerIdx] >= ROUNDS_TO_WIN_GAME) {
    state.gameOver = { winnerIdx };
    render();
    return;
  }

  // Cleanup: every Unit retires to its owner's pile; Locations remain in
  // play; no Event/triggered-effect resolution happens during cleanup.
  state.players.forEach(p => {
    p.rows.Unit.forEach((inst, i) => {
      if (!inst) return;
      inst.power = 0;
      p.retirement.push(inst);
      p.rows.Unit[i] = null;
    });
  });

  // The loser of the round that just ended starts the next one. On a tie,
  // alternate from whoever started this round (not specified for ties —
  // this is a reasonable default, easy to change if it's not what's wanted).
  const nextStarter = winnerIdx !== null ? (winnerIdx === 0 ? 1 : 0) : (state.roundStarter === 0 ? 1 : 0);
  state.roundStarter = nextStarter;
  state.active = nextStarter;
  state.roundNumber++;

  state.players.forEach(p => {
    for (let i = 0; i < 5 && p.deck.length > 0; i++) p.hand.push(p.deck.shift());
    p.cardsPlayedThisTurn = 0;
    p.hasDrawnThisTurn = false;
  });

  state.pendingReveal = state.active;
  render();
}

function toggleUi(kind, player, index, rowType) {
  if (uiOpen && uiOpen.kind === kind && uiOpen.player === player && uiOpen.index === index && uiOpen.rowType === rowType) {
    uiOpen = null;
  } else {
    uiOpen = { kind, player, index, rowType };
  }
  render();
}

function cardFront(cardId, opts) {
  opts = opts || {};
  const c = CARD_BY_ID[cardId];
  if (!c) return '<div class="card">Unknown card</div>';
  const mini = opts.mini ? ' mini' : '';
  const powerHtml = c.type !== 'Event' && c.power !== '' ? '<span class="card-power">' + (opts.power !== undefined ? opts.power : c.power) + '</span>' : '';
  let html = '<div class="card' + mini + '" style="border-top: 3px solid ' + c.color + '">';
  html += '<div class="card-name-bar" style="background:' + c.color + '"><span>' + esc(c.name) + '</span>' + powerHtml + '</div>';
  html += '<div class="card-sub">' + esc(c.subtype || c.type) + '</div>';
  if (!opts.mini) {
    html += '<div class="card-ability">' + esc(c.ability || '') + '</div>';
    if (c.flavor) html += '<div class="card-flavor">' + esc(c.flavor) + '</div>';
  }
  html += '</div>';
  return html;
}

function cardBack() {
  return '<div class="card card-back"><span>Trident</span></div>';
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderSetup() {
  const app = document.getElementById('app');
  if (!builder) {
    builder = {
      step: 'p1faction',
      p1Faction: FACTIONS[0],
      p1Picks: {},
      p1BrowseFaction: FACTIONS[0],
      p2Faction: FACTIONS[Math.min(1, FACTIONS.length - 1)],
      p2Picks: {},
      p2BrowseFaction: FACTIONS[Math.min(1, FACTIONS.length - 1)],
      filter: '',
    };
  }

  // Re-rendering on every keystroke (same pattern as the rest of the app)
  // would normally steal focus from the filter box — preserve it explicitly.
  const prevInput = document.getElementById('cardFilter');
  const hadFocus = prevInput && document.activeElement === prevInput;
  const cursorPos = hadFocus ? prevInput.selectionStart : null;

  let html = '<h2 class="sr-only">Trident digital sandbox setup</h2><h1>Trident — pass and play sandbox</h1>';

  if (builder.step === 'p1faction' || builder.step === 'p2faction') {
    const playerNum = builder.step === 'p1faction' ? 1 : 2;
    const defaultFaction = playerNum === 1 ? builder.p1Faction : builder.p2Faction;
    const opts = FACTIONS.map(f => '<option value="' + f + '"' + (f === defaultFaction ? ' selected' : '') + '>' + f + '</option>').join('');
    html += '<div class="sub">Build a ' + DECK_SIZE + '-card deck for each player, per the Deck Construction rules — at least ' +
      MIN_MAIN_FACTION + ' cards from a Main Faction, the rest splashed from anywhere. Step ' + playerNum + ' of 2: pick Player ' + playerNum + '\'s Main Faction.</div>';
    html += '<div class="setup-row"><label>Player ' + playerNum + ' Main Faction: <select id="facSelect">' + opts + '</select></label></div>';
    html += '<div class="setup-row"><button class="primary" onclick="chooseFaction(' + playerNum + ')">Next: build deck</button></div>';
  } else {
    const playerNum = builder.step === 'p1deck' ? 1 : 2;
    const mainFaction = playerNum === 1 ? builder.p1Faction : builder.p2Faction;
    const picks = playerNum === 1 ? builder.p1Picks : builder.p2Picks;
    const browseFaction = playerNum === 1 ? builder.p1BrowseFaction : builder.p2BrowseFaction;
    const browseOpts = FACTIONS.concat(['Factionless']).map(f =>
      '<option value="' + f + '"' + (f === browseFaction ? ' selected' : '') + '>' + f + (f === mainFaction ? ' (Main)' : '') + '</option>').join('');
    const pool = CARDS.filter(c => c.faction === browseFaction);
    const filterLower = (builder.filter || '').toLowerCase();
    const visible = filterLower ? pool.filter(c => c.name.toLowerCase().includes(filterLower)) : pool;
    const result = validateDeckPicks(picks, mainFaction);

    html += '<div class="sub">Building Player ' + playerNum + '\'s deck — Main Faction: ' + mainFaction + '.</div>';
    html += '<div class="setup-row">' +
      '<button class="primary" onclick="autoBuildDeck(' + playerNum + ')">🎲 Auto-build a legal ' + DECK_SIZE + '-card deck</button>' +
      '<span class="count-badge">— random, but follows every rule below; tweak it after</span></div>';

    html += '<div class="deck-count' + (result.valid ? '' : ' invalid') + '">' +
      'Total: ' + result.total + ' / ' + DECK_SIZE + ' &nbsp;·&nbsp; ' +
      mainFaction + ': ' + result.mainFactionCount + ' (need ' + MIN_MAIN_FACTION + '+) &nbsp;·&nbsp; ' +
      'Unique: ' + result.uniqueCount + ' / ' + MAX_UNIQUE_CARDS + '</div>';
    if (result.errors.length) {
      html += '<div class="deck-errors">' + result.errors.map(e => '<div>⚠️ ' + esc(e) + '</div>').join('') + '</div>';
    }

    html += '<div class="setup-row">' +
      '<label>Browsing: <select id="browseSelect" onchange="setBrowseFaction(' + playerNum + ', this.value)">' + browseOpts + '</select></label>' +
      '<input id="cardFilter" type="text" placeholder="Filter by name..." value="' + esc(builder.filter || '') + '" oninput="setDeckFilter(' + playerNum + ', this.value)" style="flex:1;min-width:180px">' +
      '<button onclick="clearDeckSelection(' + playerNum + ')">Clear whole deck</button></div>';

    html += '<div class="card-list">';
    visible.forEach(c => {
      const qty = picks[c.id] || 0;
      const cap = maxCopiesFor(c);
      const powerText = c.type !== 'Event' && c.power !== '' ? ' · Power ' + c.power : '';
      const tagText = c.isUnique ? ' · Unique' : (c.rarity === 'Mythic' ? ' · Mythic' : '');
      html += '<div class="card-row">' +
        '<span class="card-row-name">' + esc(c.name) + '</span>' +
        '<span class="card-row-meta">' + esc(c.type) + powerText + ' · ' + esc(c.rarity) + tagText + '</span>' +
        '<span class="qty-stepper">' +
        '<button onclick="adjustPick(' + playerNum + ",'" + c.id + "',-1)\" " + (qty <= 0 ? 'disabled' : '') + '>−</button>' +
        '<span class="qty-value">' + qty + '</span>' +
        '<button onclick="adjustPick(' + playerNum + ",'" + c.id + "',1)\" " + (qty >= cap ? 'disabled' : '') + '>+</button>' +
        '</span></div>';
    });
    if (visible.length === 0) html += '<div class="card-row">No cards match that filter.</div>';
    html += '</div>';
    const btnLabel = playerNum === 1 ? 'Confirm deck — build Player 2\'s deck' : 'Confirm deck — start game';
    html += '<div class="setup-row"><button class="primary" ' + (result.valid ? '' : 'disabled') + ' onclick="confirmDeck(' + playerNum + ')">' + btnLabel + '</button></div>';
  }

  app.innerHTML = html;
  if (hadFocus) {
    const newInput = document.getElementById('cardFilter');
    if (newInput) { newInput.focus(); newInput.setSelectionRange(cursorPos, cursorPos); }
  }
}

function chooseFaction(playerNum) {
  const val = document.getElementById('facSelect').value;
  if (playerNum === 1) { builder.p1Faction = val; builder.p1BrowseFaction = val; builder.step = 'p1deck'; }
  else { builder.p2Faction = val; builder.p2BrowseFaction = val; builder.step = 'p2deck'; }
  builder.filter = '';
  renderSetup();
}

function setBrowseFaction(playerNum, value) {
  if (playerNum === 1) builder.p1BrowseFaction = value; else builder.p2BrowseFaction = value;
  renderSetup();
}

function setDeckFilter(playerNum, value) {
  builder.filter = value;
  renderSetup();
}

function adjustPick(playerNum, cardId, delta) {
  const picks = playerNum === 1 ? builder.p1Picks : builder.p2Picks;
  const card = CARD_BY_ID[cardId];
  const cap = maxCopiesFor(card);
  const current = picks[cardId] || 0;
  const next = Math.max(0, Math.min(cap, current + delta));
  if (next === 0) delete picks[cardId]; else picks[cardId] = next;
  renderSetup();
}

function clearDeckSelection(playerNum) {
  if (playerNum === 1) builder.p1Picks = {}; else builder.p2Picks = {};
  renderSetup();
}

// Random but rule-legal deck: fills the Main Faction first (up to a
// comfortable target above the 40-card minimum), then splashes the rest
// from other factions/Factionless — respecting copy caps, the Unique cap,
// the Mythic cap, and the "off-faction Unique ≤ Main Faction Unique" ratio
// at every step, so the result is always a valid, confirmable deck.
function autoBuildDeck(playerNum) {
  const mainFaction = playerNum === 1 ? builder.p1Faction : builder.p2Faction;
  const picks = {};
  let total = 0, mainCount = 0, uniqueCount = 0, mainFactionUniqueCount = 0, otherFactionUniqueCount = 0;

  function tryAdd(card, wantQty) {
    const cap = maxCopiesFor(card);
    const current = picks[card.id] || 0;
    let addQty = Math.min(wantQty, cap - current, DECK_SIZE - total);
    if (addQty <= 0) return 0;
    if (card.isUnique) {
      addQty = Math.min(addQty, MAX_UNIQUE_CARDS - uniqueCount);
      if (card.faction !== mainFaction && card.faction !== 'Factionless') {
        addQty = Math.min(addQty, mainFactionUniqueCount - otherFactionUniqueCount);
      }
      if (addQty <= 0) return 0;
    }
    picks[card.id] = current + addQty;
    total += addQty;
    if (card.faction === mainFaction) mainCount += addQty;
    if (card.isUnique) {
      uniqueCount += addQty;
      if (card.faction === mainFaction) mainFactionUniqueCount += addQty;
      else if (card.faction !== 'Factionless') otherFactionUniqueCount += addQty;
    }
    return addQty;
  }

  const mainTarget = Math.min(DECK_SIZE, MIN_MAIN_FACTION + 5);
  const mainPool = shuffle(CARDS.filter(c => c.faction === mainFaction));
  mainPool.forEach(c => { if (mainCount < mainTarget) tryAdd(c, Math.min(3, mainTarget - mainCount)); });
  let guard = 0;
  while (mainCount < MIN_MAIN_FACTION && guard < 1000) {
    tryAdd(mainPool[Math.floor(Math.random() * mainPool.length)], 1);
    guard++;
  }

  const splashPool = shuffle(CARDS.filter(c => c.faction !== mainFaction));
  guard = 0;
  let idx = 0;
  while (total < DECK_SIZE && guard < 3000) {
    tryAdd(splashPool[idx % splashPool.length], Math.min(3, DECK_SIZE - total));
    idx++;
    guard++;
  }

  if (playerNum === 1) builder.p1Picks = picks; else builder.p2Picks = picks;
  renderSetup();
}

function confirmDeck(playerNum) {
  const mainFaction = playerNum === 1 ? builder.p1Faction : builder.p2Faction;
  const picks = playerNum === 1 ? builder.p1Picks : builder.p2Picks;
  if (!validateDeckPicks(picks, mainFaction).valid) return; // guard — button is disabled anyway
  if (playerNum === 1) {
    builder.step = 'p2faction';
    renderSetup();
  } else {
    startGameWithDecks(builder.p1Faction, builder.p1Picks, builder.p2Faction, builder.p2Picks);
  }
}

function renderSlotDiv(pIdx, rowType, slotIdx) {
  const inst = state.players[pIdx].rows[rowType][slotIdx];
  let html = '<div class="slot ' + rowType.toLowerCase() + '-slot' + (inst ? ' filled' : '') + '" ' +
    'ondragover="onSlotDragOver(event,' + pIdx + ",'" + rowType + "'," + slotIdx + ')" ' +
    'ondragleave="onSlotDragLeave(event)" ' +
    'ondrop="onSlotDrop(event,' + pIdx + ",'" + rowType + "'," + slotIdx + ')" ' +
    'onclick="' + (inst ? "toggleUi('slot'," + pIdx + "," + slotIdx + ",'" + rowType + "')" : '') + '">';
  if (inst) {
    html += cardFront(inst.cardId, { mini: true, power: currentPower(inst) });
  } else {
    html += '<span class="empty-slot-label">Empty</span>';
  }
  html += '</div>';
  return html;
}

function renderLanes(pIdx) {
  const p = state.players[pIdx];
  let html = '<div class="lanes">';
  for (let slotIdx = 0; slotIdx < 3; slotIdx++) {
    html += '<div class="lane"><div class="lane-label">Lane ' + (slotIdx + 1) + '</div>';
    html += renderSlotDiv(pIdx, 'Location', slotIdx);
    html += renderSlotDiv(pIdx, 'Unit', slotIdx);
    html += '</div>';
  }
  html += '</div>';

  if (uiOpen && uiOpen.kind === 'slot' && uiOpen.player === pIdx) {
    const rowType = uiOpen.rowType;
    const inst = p.rows[rowType][uiOpen.index];
    if (inst) {
      html += '<div class="overlay">' + cardFront(inst.cardId, { power: currentPower(inst) }) +
        '<div style="margin-top:8px">' +
        '<button onclick="adjustPower(' + pIdx + ",'" + rowType + "'," + uiOpen.index + ',1)">+1 Power</button>' +
        '<button onclick="adjustPower(' + pIdx + ",'" + rowType + "'," + uiOpen.index + ',-1)">-1 Power</button>' +
        '<button onclick="returnToHand(' + pIdx + ",'" + rowType + "'," + uiOpen.index + ')">Return to hand</button>' +
        '<button onclick="retireSlot(' + pIdx + ",'" + rowType + "'," + uiOpen.index + ')">Retire</button>' +
        '</div></div>';
    }
  }
  return html;
}

function renderPlayerZone(pIdx) {
  const p = state.players[pIdx];
  const active = state.active === pIdx;
  const drawDisabled = !active || p.deck.length === 0 || p.hasDrawnThisTurn;
  let html = '<div class="player-zone' + (active ? ' active' : '') + '">';
  html += '<div class="zone-header"><strong>' + p.name + ' — ' + p.faction + (active ? ' (active)' : '') +
          '</strong><span class="total-power">Total Power: ' + totalPower(pIdx) + '</span>' +
          (active ? '<span class="turn-status">Plays: ' + p.cardsPlayedThisTurn + '/' + MAX_PLAYS_PER_TURN + ' · Drawn: ' + (p.hasDrawnThisTurn ? 'Yes' : 'No') + '</span>' : '') +
          '<button onclick="draw(' + pIdx + ')" ' + (drawDisabled ? 'disabled' : '') + '>Draw</button></div>';

  html += '<div class="pile-row">';
  html += '<div class="pile"><div class="pile-stack" title="Deck">' + p.deck.length + '</div><div class="pile-label">Deck</div></div>';
  html += '<div class="pile"><div class="pile-stack" ' +
    'ondragover="onPileDragOver(event,' + pIdx + ')" ondragleave="onPileDragLeave(event)" ondrop="onPileDrop(event,' + pIdx + ')" ' +
    'onclick="toggleUi(\'retirement\',' + pIdx + ',0)" title="Retirement pile — drag an Event here to play it">' + p.retirement.length + '</div><div class="pile-label">Retirement</div></div>';
  html += '</div>';

  if (uiOpen && uiOpen.kind === 'retirement' && uiOpen.player === pIdx) {
    html += '<div class="overlay"><div class="retirement-list">';
    if (p.retirement.length === 0) html += '<div class="count-badge">Empty</div>';
    p.retirement.forEach((inst, i) => {
      const c = CARD_BY_ID[inst.cardId];
      html += '<div class="retirement-item">' + esc(c.name) + ' <button onclick="retirementReturn(' + pIdx + ',' + i + ')">Return to hand</button></div>';
    });
    html += '</div></div>';
  }

  html += renderLanes(pIdx);

  html += '<div class="zone-header" style="margin-top:8px"><span class="count-badge">Hand (' + p.hand.length + ')</span></div>';
  html += '<div class="hand">';
  if (active) {
    p.hand.forEach((inst, handIdx) => {
      html += '<div draggable="true" ondragstart="onHandDragStart(event,' + pIdx + ',' + handIdx + ')" ondragend="onHandDragEnd(event)" ' +
        'onclick="toggleUi(\'hand\',' + pIdx + ',' + handIdx + ')">' + cardFront(inst.cardId) + '</div>';
    });
  } else {
    // Hidden — this is same-screen pass-and-play, so the other player's hand
    // contents must not be visible while it isn't their turn. No handlers:
    // nothing to click or drag on a face-down card.
    p.hand.forEach(() => { html += cardBack(); });
  }
  html += '</div>';

  if (active && uiOpen && uiOpen.kind === 'hand' && uiOpen.player === pIdx) {
    const inst = p.hand[uiOpen.index];
    if (inst) {
      const c = CARD_BY_ID[inst.cardId];
      html += '<div class="overlay">';
      if (!active) {
        html += 'Not your turn.';
      } else if (p.cardsPlayedThisTurn >= MAX_PLAYS_PER_TURN) {
        html += 'You\'ve already played ' + MAX_PLAYS_PER_TURN + ' cards this turn.';
      } else if (c.type === 'Event') {
        html += 'Events resolve immediately and don\'t take a row slot. ';
        html += '<button onclick="playEvent(' + pIdx + ',' + uiOpen.index + ')">Play (to Retirement)</button>';
      } else {
        const rowType = c.type === 'Location' ? 'Location' : 'Unit';
        html += 'Play to ' + rowType + ' slot: ';
        p.rows[rowType].forEach((slotInst, slotIdx) => {
          html += '<button onclick="playToSlot(' + pIdx + ',' + uiOpen.index + ",'" + rowType + "'," + slotIdx + ')">Slot ' + (slotIdx + 1) + (slotInst ? ' (replaces)' : '') + '</button>';
        });
      }
      html += '</div>';
    }
  }

  html += '</div>';
  return html;
}

function renderConflictBanner() {
  if (state.gameOver) {
    const winner = state.players[state.gameOver.winnerIdx];
    return '<div class="conflict-banner game-over">🏆 ' + winner.name + ' wins the game! (' +
      state.roundWins[0] + '–' + state.roundWins[1] + ' rounds)</div>';
  }
  if (!state.lastRoundResult) return '';
  const r = state.lastRoundResult;
  let resultText;
  if (r.winnerIdx === null) {
    resultText = 'Round ' + r.roundNumber + ' tied at ' + r.totals[0] + ' Power each. ';
  } else {
    const winner = state.players[r.winnerIdx];
    resultText = winner.name + ' won round ' + r.roundNumber + ' — ' + Math.max(r.totals[0], r.totals[1]) + ' Power to ' + Math.min(r.totals[0], r.totals[1]) + '. ';
  }
  return '<div class="conflict-banner">' + resultText +
    'Score: ' + r.roundWins[0] + '–' + r.roundWins[1] + '. Units retired, Locations held, both players drew a fresh 5 — ' +
    state.players[state.active].name + ' starts round ' + state.roundNumber + '.</div>';
}

function dismissPendingReveal() {
  state.pendingReveal = null;
  render();
}

const SAVE_KEY = 'trident_sandbox_save_v1';

function saveState() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({ state, uiOpen }));
  } catch (e) {
    // Storage can fail (disabled, full, private mode) — the game still
    // works fine in-memory for this session, it just won't survive a reload.
  }
}

function loadState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    return parsed && parsed.state ? parsed : null;
  } catch (e) {
    return null;
  }
}

function clearSavedState() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
}

function newGame() {
  state = null;
  builder = null;
  uiOpen = null;
  clearSavedState();
  render();
}

function render() {
  if (!state) { renderSetup(); return; }
  const app = document.getElementById('app');

  if (state.pendingReveal !== null) {
    const name = state.players[state.pendingReveal].name;
    app.innerHTML =
      '<h2 class="sr-only">Pass the device</h2>' +
      '<div class="pass-screen">' +
      '<p class="pass-title">Pass the device to ' + esc(name) + '</p>' +
      '<p class="pass-sub">The other player should look away — this hides their hand until you tap continue.</p>' +
      '<button class="primary" onclick="dismissPendingReveal()">I\'m ' + esc(name) + ' — continue</button>' +
      '</div>';
    saveState();
    return;
  }

  let html = '<h2 class="sr-only">Trident pass and play game board</h2>';
  html += '<div class="toolbar"><h1 style="margin:0">Trident sandbox</h1>' +
          '<span class="turn-status">Round ' + state.roundNumber + ' · Score ' + state.roundWins[0] + '–' + state.roundWins[1] + '</span>' +
          '<button class="primary" onclick="endTurn()" ' + (state.gameOver ? 'disabled' : '') + '>End turn (pass to ' + state.players[state.active === 0 ? 1 : 0].name + ')</button>' +
          '<button onclick="newGame()">New game</button></div>';
  html += renderConflictBanner();
  html += '<div class="board">' + renderPlayerZone(1) + renderPlayerZone(0) + '</div>';
  app.innerHTML = html;
  saveState();
}

(function initFromSave() {
  const saved = loadState();
  if (saved) {
    state = saved.state;
    uiOpen = saved.uiOpen || null;
  }
  render();
})();
</script>

</body>
</html>
