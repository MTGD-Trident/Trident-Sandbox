<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<div id="bgstatic"></div><canvas id="bgfx"></canvas>
<div id="app"></div>
<div id="settings-root"></div>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: oklch(0.14 0.01 60); overflow: hidden; height: 100%; }
  body { font-family: 'Spectral', Georgia, serif; color: oklch(0.93 0.01 70); height: 100%; display: flex; justify-content: center; align-items: center; }
  #app { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; overflow: hidden;
         padding: var(--safe-area-inset-top, env(safe-area-inset-top, 0px)) var(--safe-area-inset-right, env(safe-area-inset-right, 0px))
                  var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)) var(--safe-area-inset-left, env(safe-area-inset-left, 0px)); }
  #scale-wrapper { width: 900px; flex: none; transform-origin: center center; border-radius: 14px;
                   background: radial-gradient(120% 60% at 50% 0%, oklch(0.24 0.02 60 / 0.42), oklch(0.17 0.015 60 / 0.34) 60%, oklch(0.14 0.012 60 / 0.30));
                   box-shadow: 0 0 60px oklch(0 0 0 / 0.55); }
  #bgstatic, #bgfx { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  #bgfx { display: none; }
  #app { position: relative; z-index: 1; }
  #settings-root { position: relative; z-index: 900; }
  .infopanel.settings-btn { cursor: pointer; }
  .setup-settings { position: fixed; top: 16px; right: 16px; z-index: 50; padding: 8px 14px; border-radius: 8px; border: 1px solid oklch(0.45 0.02 60);
    background: oklch(0.22 0.015 60 / 0.9); color: oklch(0.93 0.01 70); font-family: 'Barlow Condensed', sans-serif; font-size: 15px; letter-spacing: 0.05em; cursor: pointer; }
  .settings-backdrop { position: fixed; inset: 0; background: oklch(0.05 0 0 / 0.6); display: flex; align-items: center; justify-content: center; z-index: 900; }
  .settings-panel { width: min(640px, 94vw); max-height: 90vh; overflow-y: auto; background: oklch(0.2 0.015 60); border: 1px solid oklch(0.34 0.02 60);
    border-radius: 16px; padding: 18px 20px; color: oklch(0.93 0.01 70); font-family: 'Spectral', Georgia, serif; }
  .set-head { display: flex; align-items: center; justify-content: space-between; font-size: 22px; margin-bottom: 8px; }
  .set-done, .sfx-test button { font-family: 'Barlow Condensed', sans-serif; font-size: 15px; padding: 6px 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid oklch(0.45 0.03 85); background: oklch(0.62 0.14 85); color: oklch(0.15 0.02 60); }
  .set-sec { margin: 14px 0; }
  .set-h { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: oklch(0.7 0.02 70); margin-bottom: 8px; }
  .bg-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .bg-tile { background: none; border: 2px solid oklch(0.32 0.02 60); border-radius: 10px; padding: 4px; cursor: pointer; color: inherit; text-align: center; }
  .bg-tile.on, .track.on { border-color: oklch(0.82 0.15 85); box-shadow: 0 0 10px oklch(0.82 0.15 85 / 0.5); }
  .bg-tile .swatch { display: flex; align-items: flex-end; justify-content: center; height: 64px; border-radius: 7px; }
  .bg-tile .anim { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; letter-spacing: 0.08em; color: #fff; background: oklch(0 0 0 / 0.45); padding: 1px 6px; border-radius: 6px; margin-bottom: 4px; }
  .bg-tile .nm { display: block; font-size: 14px; margin-top: 4px; }
  .track-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 10px; }
  .track { display: flex; flex-direction: column; align-items: flex-start; padding: 8px 12px; border-radius: 10px; cursor: pointer; color: inherit;
    background: oklch(0.24 0.015 60); border: 2px solid oklch(0.32 0.02 60); text-align: left; font-family: inherit; }
  .track .nm { font-size: 15px; } .track .note { font-size: 12px; opacity: 0.65; }
  .vol { display: flex; align-items: center; gap: 12px; font-size: 15px; }
  .vol input { flex: 1; accent-color: oklch(0.72 0.15 85); height: 28px; }
  .vol span { width: 44px; text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 13px; }
  .sfx-test { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .sfx-test button { background: oklch(0.26 0.02 60); color: inherit; border-color: oklch(0.38 0.02 60); text-transform: capitalize; }
  .mute { display: flex; align-items: center; gap: 10px; font-size: 15px; margin-top: 6px; }
  .mute input { width: 20px; height: 20px; accent-color: oklch(0.72 0.15 85); }

  select, button { font: inherit; }
  button { cursor: pointer; }
  h1 { font-size: 22px; font-weight: 500; margin-bottom: 4px; }
  .sub { color: oklch(0.66 0.012 70); margin-bottom: 20px; font-size: 14px; }

  /* ---- setup / deck-builder (unchanged functionality, restyled minimally) ---- */
  #app.setup-mode { display: block; padding: 20px; color: oklch(0.93 0.01 70); }
  .setup-row { display: flex; gap: 16px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .setup-row select, .setup-row input, .setup-row button { padding: 8px 14px; border-radius: 8px; border: 1px solid oklch(0.4 0.02 60); background: oklch(0.22 0.015 60); color: oklch(0.93 0.01 70); }
  .setup-row button.primary { background: #d99a3f; color: #1a1206; border: none; font-weight: 600; }
  .setup-row button:disabled { opacity: 0.4; cursor: not-allowed; }
  .card-list { max-height: 420px; overflow-y: auto; border: 1px solid oklch(0.36 0.018 60); border-radius: 8px; margin-bottom: 12px; }
  .card-row { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-bottom: 1px solid oklch(0.3 0.016 60); font-size: 13px; }
  .card-row:last-child { border-bottom: none; }
  .card-row-name { flex: 1; }
  .card-row-meta { color: oklch(0.62 0.012 70); font-size: 12px; white-space: nowrap; }
  .qty-stepper { display: flex; align-items: center; gap: 6px; }
  .qty-stepper button { padding: 2px 9px; font-size: 14px; border-radius: 6px; border: 1px solid oklch(0.4 0.02 60); background: oklch(0.26 0.02 60); color: inherit; }
  .qty-value { min-width: 14px; text-align: center; font-weight: 500; }
  .deck-count { font-size: 13px; font-weight: 500; margin-bottom: 8px; }
  .deck-count.invalid { color: oklch(0.68 0.16 30); }
  .deck-errors { font-size: 12px; color: oklch(0.68 0.16 30); margin-bottom: 10px; }
  .pass-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 320px; gap: 10px; padding: 20px; }
  .pass-title { font-size: 22px; font-weight: 500; margin: 0; }
  .pass-sub { color: oklch(0.66 0.012 70); font-size: 14px; margin: 0 0 12px; }

  /* ---- top bar ---- */
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; }
  .topbar-group { display: flex; gap: 8px; }
  .infopanel { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;
               background: oklch(0.24 0.015 60); border: 1px solid oklch(0.38 0.018 60); border-radius: 6px; padding: 8px 14px; color: oklch(0.80 0.012 70); }
  .infopanel.center { text-align: center; }
  .infopanel.end-game { border-color: oklch(0.62 0.16 30); color: oklch(0.78 0.14 30); background: oklch(0.24 0.03 30 / 0.3); cursor: pointer; }
  .topbar-center { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .topbar-center .row { display: flex; gap: 6px; }
  .topbar-right { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .timer-panel { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; text-align: center; }

  /* ---- per-side zone ---- */
  .side { display: grid; grid-template-columns: repeat(3, 1fr) 130px; gap: 10px; padding: 6px 16px; align-items: start; }
  .lane { position: relative; height: 462px; }
  .loc-slot, .unit-slot { position: absolute; left: 0; right: 0; border-radius: 8px; overflow: hidden; border: 1.5px solid oklch(0.42 0.018 60 / 0.8); background: oklch(0.2 0.015 60 / 0.5); }
  .loc-slot { top: 137px; height: 325px; z-index: 1; box-shadow: 0 5px 10px oklch(0.10 0.01 60 / 0.45); }
  .unit-slot { top: 0; height: 325px; z-index: 2; box-shadow: 0 7px 16px oklch(0.08 0.01 60 / 0.6); }
  .slot-empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  .slot-empty.loc-empty { justify-content: flex-end; padding-bottom: 8%; } /* Location's empty label must sit in the peek strip, not its own true center — that center sits behind the Unit slot on top of it */
  .slot-empty .diamond { width: 26px; height: 26px; border: 2px solid oklch(0.46 0.03 140); transform: rotate(45deg); }
  .slot-empty .lbl { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: oklch(0.54 0.02 140); }
  .drag-valid { border-color: oklch(0.74 0.13 72) !important; background: oklch(0.32 0.05 72) !important; }
  .drag-invalid { border-color: oklch(0.6 0.16 25) !important; background: oklch(0.3 0.05 25) !important; }

  .sidecol { height: 462px; display: flex; flex-direction: column; gap: 8px; }
  .sidebox { flex: 1; border-radius: 8px; border: 1.5px solid oklch(0.36 0.018 60); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: 'Barlow Condensed', sans-serif; }
  .sidebox .lbl { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; }
  .sidebox .val { font-size: 22px; font-weight: 700; }
  .sidebox.deck { background: oklch(0.28 0.05 300); border-color: oklch(0.45 0.08 300); cursor: pointer; }
  .sidebox.retire { background: oklch(0.30 0.06 45); border-color: oklch(0.48 0.10 45); position: relative; overflow: hidden; cursor: pointer; }
  .sidebox.retire .pile-top { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    filter: grayscale(0.75) brightness(0.55); pointer-events: none; }
  .sidebox.retire .pile-lbl, .sidebox.deck .pile-lbl { position: relative; z-index: 2; text-align: center; }
  .sidebox.deck { position: relative; overflow: hidden; }
  .sidebox.deck .deck-back { position: absolute; inset: 4px; display: flex; align-items: center; justify-content: center; filter: brightness(0.8); pointer-events: none; }
  .sidebox.deck.has-top .pile-lbl { background: oklch(0.12 0.03 270 / 0.78); border: 1px solid oklch(0.6 0.04 270); border-radius: 8px; padding: 4px 12px; }
  .sidebox.retire.has-top .pile-lbl { background: oklch(0.12 0.02 45 / 0.78); border: 1px solid oklch(0.48 0.10 45); border-radius: 8px; padding: 4px 12px; }
  .counterpanel.tappable { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
  .pile-panel { width: min(760px, 94vw); }
  .pile-sub { font-size: 13px; opacity: 0.7; margin: 2px 0 12px; }
  .pick-card.pile-newest { outline: 2px solid oklch(0.7 0.1 45); }
  .prompt-panel { flex: 1; height: 290px; display: flex; gap: 20px; align-items: center; padding: 16px 22px; border-radius: 16px;
    background: linear-gradient(160deg, oklch(0.36 0.09 85 / 0.97), oklch(0.26 0.06 70 / 0.97)); border: 3px solid oklch(0.82 0.15 85);
    color: oklch(0.98 0.01 85); animation: promptGlow 1.6s ease-in-out infinite; }
  @keyframes promptGlow { 0%, 100% { box-shadow: 0 0 10px 2px oklch(0.82 0.15 85 / 0.45); } 50% { box-shadow: 0 0 28px 8px oklch(0.82 0.15 85 / 0.85); } }
  .prompt-panel .pp-card { flex: none; width: 150px; height: 210px; } /* cards size from height; 150 x 210 keeps the card's proportions */
  .prompt-panel .pp-body { flex: 1; min-width: 0; }
  .prompt-panel .pp-text { font-size: 25px; line-height: 1.2; font-weight: 600; }
  .prompt-panel .pp-how { font-size: 17px; margin-top: 8px; color: oklch(0.92 0.08 85); }
  .prompt-panel .pp-detail { font-size: 15px; margin-top: 8px; opacity: 0.85; font-style: italic; max-height: 66px; overflow: hidden; }
  .prompt-panel .pp-btns { display: flex; gap: 12px; margin-top: 14px; }
  .prompt-panel .pp-btns button { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; letter-spacing: 0.05em; padding: 10px 30px; border-radius: 10px;
    cursor: pointer; border: 2px solid oklch(0.9 0.05 85); background: oklch(0.22 0.03 60); color: oklch(0.97 0.01 85); }
  .prompt-panel .pp-btns button.primary { background: oklch(0.85 0.14 85); color: oklch(0.18 0.03 60); border-color: transparent; }
  .sidebox.power { background: oklch(0.30 0.01 60); border-radius: 50%; aspect-ratio: 1; flex: none; margin: 0 auto; width: 76%; }
  .sidebox.drawcard { background: oklch(0.55 0.14 220); border-color: oklch(0.65 0.14 220); color: #06111c; cursor: pointer; flex: none; height: 56px; }
  .side-extra { display: flex; flex-direction: column; gap: 8px; align-items: stretch; width: 130px; flex: none; margin-bottom: 12px; }
  .hand-row { display: flex; align-items: flex-end; gap: 10px; padding: 6px 16px 22px; } /* bottom pad: the fan's rotated corners */
  .hand-row .handwrap { flex: 1; width: auto; height: 290px; } /* card is ~245px tall; room for the fan and a lifted selection */
  .sidebox.drawcard:disabled { opacity: 0.4; cursor: not-allowed; }
  .sidebox.endturn { flex: none; height: 56px; font-family: 'Barlow Condensed', sans-serif; font-size: 18px; letter-spacing: 0.04em;
    background: oklch(0.26 0.02 60); border: 1px solid oklch(0.36 0.02 60); color: oklch(0.55 0.02 70); cursor: not-allowed; }
  .sidebox.endturn.ready { background: oklch(0.72 0.15 85); border-color: oklch(0.82 0.15 85); color: oklch(0.18 0.03 60); cursor: pointer;
    animation: endPulse 1.6s ease-in-out infinite; }
  @keyframes endPulse { 0%, 100% { box-shadow: 0 0 0 0 oklch(0.82 0.15 85 / 0.0); } 50% { box-shadow: 0 0 14px 3px oklch(0.82 0.15 85 / 0.7); } }
  .counterpanel { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
                  background: oklch(0.24 0.015 60); border: 1px solid oklch(0.36 0.018 60); border-radius: 6px; padding: 6px 10px; text-align: center; }

  .phasebar { display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: oklch(0.17 0.014 60); border-top: 1px solid oklch(0.30 0.016 60); border-bottom: 1px solid oklch(0.30 0.016 60); }
  .phasebar .line { height: 1px; flex: 1; background: linear-gradient(90deg, transparent, oklch(0.42 0.02 60)); }
  .phasebar .line.r { background: linear-gradient(90deg, oklch(0.42 0.02 60), transparent); }
  .phasebar .lbl { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: oklch(0.66 0.012 70); white-space: nowrap; }

  .handrow { display: flex; align-items: center; justify-content: center; gap: 20px; padding: 10px 16px 24px; }
  .handwrap { position: relative; height: 340px; width: 620px; }
  .handcard { position: absolute; left: 50%; bottom: 0; width: 175px; margin-left: -87.5px; border-radius: 8px; overflow: hidden;
              box-shadow: 0 8px 18px oklch(0.10 0.01 60 / 0.55); transform-origin: 50% 100%; transition: transform 140ms ease; cursor: grab; }
  .handcard:active { cursor: grabbing; }

  /* ---- the established card itself (shared by lane / hand / enlarged) ---- */
  .card-fill { position: absolute; inset: 0; display: flex; align-items: stretch; justify-content: center; }
  .est-card { position: relative; height: 100%; width: auto; margin: 0 auto; border-radius: 6px; overflow: hidden; background: #fff; }
  .est-box { position: absolute; }
  .est-mask { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; pointer-events: none; }
  .est-art { background-size: cover; background-position: center; }
  .est-name { display: flex; align-items: center; padding-left: 4%; font-weight: 700; line-height: 1.05;
              color: oklch(0.20 0.02 60); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .est-power { display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif;
               font-weight: 700; color: #fff; text-shadow: -1px -1px 0 #223, 1px -1px 0 #223, -1px 1px 0 #223, 1px 1px 0 #223; }
  .est-subtype { display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif;
                 font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: oklch(0.30 0.02 60 / 0.75); overflow: hidden; }
  .est-ability { line-height: 1.28; color: oklch(0.16 0.02 60); overflow: hidden; padding: 0 1%; }
  .est-flavor { font-style: italic; color: oklch(0.40 0.02 60); overflow: hidden; padding: 0 1%; border-top: 1px solid oklch(0.7 0.01 60 / 0.4); }
  .est-legalL { color: oklch(0.45 0.02 60); display: flex; align-items: center; }
  .est-gem { width: 100%; height: 100%; object-fit: contain; }
  .placeholder-art { width: 100%; height: 100%; background: repeating-linear-gradient(135deg, oklch(0.60 0.01 60) 0 7px, oklch(0.66 0.01 60) 7px 14px); }

  /* persistent power stepper, always visible on a played card */
  .power-stepper { position: absolute; display: flex; gap: 2px; z-index: 20; }
  .power-stepper button { width: 22px; height: 22px; border-radius: 50%; border: 1px solid oklch(0.4 0.02 60); background: oklch(0.22 0.02 60 / 0.9);
                           color: oklch(0.93 0.01 70); font-size: 13px; font-weight: 700; line-height: 1; display: flex; align-items: center; justify-content: center; padding: 0; }

  /* tap-to-inspect enlarge modal */
  .inspect-backdrop { position: fixed; inset: 0; background: oklch(0.05 0 0 / 0.72); z-index: 500; display: flex; align-items: center; justify-content: center; }
  .inspect-card-wrap { width: min(82vw, 82vh * 0.7145); aspect-ratio: 0.7145; }

  .conflict-banner { background: #3B4A8F; color: white; padding: 12px 16px; margin: 0 16px 10px; border-radius: 10px; font-size: 14px; }
  .conflict-banner.game-over { background: #B8860B; font-size: 17px; font-weight: 600; text-align: center; }
  /* Card animations */
  .fly-card { position: fixed; left: 0; top: 0; z-index: 800; pointer-events: none; perspective: 900px; will-change: transform; }
  .fly-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; }
  .fly-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 6px;
    box-shadow: 0 10px 28px oklch(0 0 0 / 0.55); }
  .fly-back { transform: rotateY(180deg); }
  .fly-card.flip .fly-inner { transform: rotateY(180deg); }
  /* Ability engine UI */
  .target-legal, .selected { cursor: pointer; }
  .target-legal::after, .selected::after { content: ''; position: absolute; inset: 0; border-radius: 6px; pointer-events: none; z-index: 30; }
  .target-legal::after { border: 3px solid oklch(0.82 0.16 85); animation: targetPulse 1.1s ease-in-out infinite; }
  .selected::after { border: 3px solid oklch(0.80 0.12 230); animation: selectPulse 1.4s ease-in-out infinite; }
  @keyframes targetPulse { 0%, 100% { box-shadow: inset 0 0 8px 2px oklch(0.82 0.16 85 / 0.5); } 50% { box-shadow: inset 0 0 22px 8px oklch(0.82 0.16 85 / 0.9); } }
  @keyframes selectPulse { 0%, 100% { box-shadow: inset 0 0 6px 1px oklch(0.80 0.12 230 / 0.45); } 50% { box-shadow: inset 0 0 18px 6px oklch(0.80 0.12 230 / 0.85); } }
  .phasebar.prompt-bar { gap: 10px; padding: 5px 16px; min-height: 41px; background: oklch(0.32 0.08 85); color: oklch(0.97 0.01 85); font-size: 14px; }
  .prompt-bar .prompt-text { flex: 1; }
  .prompt-bar .hint { opacity: 0.75; font-size: 12px; }
  .prompt-bar button, .pick-actions button { font-family: 'Barlow Condensed', sans-serif; font-size: 14px; letter-spacing: 0.06em;
    padding: 6px 14px; border-radius: 8px; border: 1px solid oklch(0.55 0.04 85); background: oklch(0.24 0.02 60); color: inherit; cursor: pointer; }
  .prompt-bar button.primary, .pick-actions button.primary { background: oklch(0.62 0.14 85); color: oklch(0.15 0.02 60); border-color: transparent; }
  .pick-actions button:disabled { opacity: 0.4; cursor: default; }
  .action-log { margin: 0 16px 6px; height: 18px; line-height: 18px; font-size: 12px; color: oklch(0.72 0.012 70); font-family: 'IBM Plex Mono', monospace;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conflict-badge, .shield-badge { position: absolute; left: 4%; bottom: 4%; z-index: 20; font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px; padding: 1px 6px; border-radius: 8px; background: oklch(0.30 0.10 25 / 0.92); color: white; }
  .shield-badge { left: auto; right: 4%; top: 4%; bottom: auto; background: oklch(0.32 0.08 240 / 0.92); }
  .pick-panel { background: oklch(0.2 0.015 60); border-radius: 14px; padding: 16px; max-width: 92vw; }
  .pick-title { font-size: 16px; margin-bottom: 12px; }
  .pick-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-height: 60vh; overflow-y: auto; }
  .pick-card { width: 150px; cursor: pointer; border-radius: 8px; outline: 2px solid transparent; }
  .pick-card.picked { outline: 3px solid oklch(0.82 0.16 85); }
  .pick-card { position: relative; }

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// --- Drag-and-drop: the ONLY way to move a card between zones now. ---
// dragSource distinguishes a drag that started in the HAND (which can play a

// the BOARD (which can only be retired or returned to hand — you can't

function onHandDragStart(e, pIdx, handIdx) {
  const p = state.players[pIdx];
  const inst = p.hand[handIdx];
  const c = CARD_BY_ID[inst.cardId];
  dragSource = { source: 'hand', pIdx, handIdx, cardId: inst.cardId, type: c.type };
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', inst.cardId);
  // The Unit slot sits visually on top of the Location slot in their
  // overlapping region (that's the intentional "covers" effect) — but that
  // means it also wins hit-testing there. While dragging a Location card,
  // let drops fall through to the Location slot underneath instead.
  if (c.type === 'Location') {
    document.querySelectorAll('.unit-slot').forEach(el => { el.style.pointerEvents = 'none'; });
  }
}

function onBoardDragStart(e, pIdx, rowType, slotIdx) {
  const inst = state.players[pIdx].rows[rowType][slotIdx];
  if (!inst) return;
  const c = CARD_BY_ID[inst.cardId];
  dragSource = { source: 'board', pIdx, rowType, slotIdx, cardId: inst.cardId, type: c.type };
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', inst.cardId);
}

function onDragEndAny(e) {
  dragSource = null;
  document.querySelectorAll('.drag-valid, .drag-invalid').forEach(el => {
    el.classList.remove('drag-valid', 'drag-invalid');
  });
  document.querySelectorAll('.unit-slot').forEach(el => { el.style.pointerEvents = ''; });
}

function isValidSlotDrop(pIdx, rowType) {
  if (!dragSource) return false;
  if (state.gameOver) return false;
  if (busy()) return false;
  if (dragSource.source !== 'hand') return false; // only a hand card can be PLAYED into a slot
  if (!canPlayCard(pIdx, state.players[pIdx].hand[dragSource.handIdx])) return false;
  if (dragSource.pIdx !== pIdx) return false;
  if (dragSource.pIdx !== state.active) return false;
  if (state.players[dragSource.pIdx].cardsPlayedThisTurn >= MAX_PLAYS_PER_TURN) return false;
  const targetType = rowType === 'Location' ? 'Location' : 'Unit';
  return dragSource.type === targetType;
}

function isValidRetireDrop(pIdx) {
  if (!dragSource || busy()) return false;
  if (state.gameOver) return false;
  if (dragSource.pIdx !== pIdx) return false;
  if (dragSource.source === 'hand') {
    // Dropping an Event on Retirement plays it — it resolves immediately
    // and never occupies a row slot, so this is its only "play" target.
    if (dragSource.pIdx !== state.active) return false;
    if (state.players[dragSource.pIdx].cardsPlayedThisTurn >= MAX_PLAYS_PER_TURN) return false;
    return dragSource.type === 'Event';
  }
  return true; // retiring your own board card is always allowed, any type, either player's turn
}

function isValidHandDrop(pIdx) {
  if (!dragSource || busy()) return false;
  if (state.gameOver) return false;
  if (dragSource.source !== 'board') return false; // only a board card returns to hand this way
  return dragSource.pIdx === pIdx;
}

function onSlotDragOver(e, pIdx, rowType, slotIdx) {
  if (!isValidSlotDrop(pIdx, rowType)) { e.currentTarget.classList.add('drag-invalid'); return; }
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drag-valid');
}
function onSlotDragLeave(e) { e.currentTarget.classList.remove('drag-valid', 'drag-invalid'); }

  playToSlot(dragSource.pIdx, dragSource.handIdx, rowType, slotIdx);

}

function onRetireDragOver(e, pIdx) {

function onRetireDragLeave(e) { e.currentTarget.classList.remove('drag-valid', 'drag-invalid'); }
function onRetireDrop(e, pIdx) {

  if (state && state.pending && state.pending.type === 'target' && chooseTarget(instanceId)) return;
  if (!tapState || tapState.instanceId !== instanceId) {
    tapState = { instanceId, stage: 1 };
  } else if (tapState.stage === 1) {
    tapState = { instanceId, stage: 2 };
  } else {
    tapState = null;
  }
  render();
}
function closeInspect() { tapState = null; render(); }

function bumpPower(e, pIdx, rowType, slotIdx, delta) {
  e.stopPropagation(); // don't also trigger the card's own tap-to-inspect handler
  adjustPower(pIdx, rowType, slotIdx, delta);
}

function buildDeckFromPicks(picks) {
  const expanded = [];
  Object.entries(picks).forEach(([cardId, qty]) => {
    for (let i = 0; i < qty; i++) expanded.push(cardId);
  });
  const chosen = shuffle(expanded);
  return chosen.map((id, i) => ({ instanceId: id + '-' + i + '-' + Math.random().toString(36).slice(2, 7), cardId: id, power: null }));
}

const MAX_PLAYS_PER_TURN = 2;
const ROUNDS_TO_WIN_GAME = 2;

// Deck construction rules, per the Confluence "Deck Construction" page.
const DECK_SIZE = 60;
const MIN_MAIN_FACTION = 40;
const MAX_COPIES_PER_CARD = 3;
const MAX_COPIES_UNIQUE = 1;
const MAX_UNIQUE_CARDS = 3;
const MAX_COPIES_MYTHIC = 1;

function maxCopiesFor(card) {
  if (card.isUnique) return MAX_COPIES_UNIQUE;
  if (card.rarity === 'Mythic') return MAX_COPIES_MYTHIC;
  return MAX_COPIES_PER_CARD;
}

// Full legality check for a set of picks ({cardId: qty}) against a
// declared Main Faction. Returns { valid, errors[], totals... } — used to
// gate the Confirm button and to show a live checklist as you build.
function validateDeckPicks(picks, mainFaction) {
  const errors = [];
  let total = 0, mainFactionCount = 0, uniqueCount = 0, mainFactionUniqueCount = 0, otherFactionUniqueCount = 0;

  Object.entries(picks).forEach(([cardId, qty]) => {
    if (qty <= 0) return;
    const c = CARD_BY_ID[cardId];
    total += qty;
    const cap = maxCopiesFor(c);
    if (qty > cap) {
      errors.push(c.name + ': max ' + cap + ' cop' + (cap === 1 ? 'y' : 'ies') + ' allowed' + (c.isUnique ? ' (Unique)' : c.rarity === 'Mythic' ? ' (Mythic)' : ''));
    }
    if (c.faction === mainFaction) {
      mainFactionCount += qty;
      if (c.isUnique) mainFactionUniqueCount += qty;
    } else if (c.faction !== 'Factionless') {
      if (c.isUnique) otherFactionUniqueCount += qty;
    }
    if (c.isUnique) uniqueCount += qty;
  });

  if (total !== DECK_SIZE) errors.push('Deck must be exactly ' + DECK_SIZE + ' cards (currently ' + total + ')');
  if (mainFactionCount < MIN_MAIN_FACTION) errors.push('Need at least ' + MIN_MAIN_FACTION + ' cards from ' + mainFaction + ' (currently ' + mainFactionCount + ')');
  if (uniqueCount > MAX_UNIQUE_CARDS) errors.push('Max ' + MAX_UNIQUE_CARDS + ' Unique cards allowed (currently ' + uniqueCount + ')');
  if (otherFactionUniqueCount > mainFactionUniqueCount) errors.push('Off-faction Unique cards (' + otherFactionUniqueCount + ') can\'t exceed Main Faction Unique cards (' + mainFactionUniqueCount + ')');

  return { valid: errors.length === 0, errors, total, mainFactionCount, uniqueCount };
}

function startGameWithDecks(f1, picks1, f2, picks2) {
  const p1deck = buildDeckFromPicks(picks1);
  const p2deck = buildDeckFromPicks(picks2);
  state = {
    players: [
      { name: 'Player 1', faction: f1, deck: p1deck, hand: p1deck.splice(0, 5), rows: { Unit: [null, null, null], Location: [null, null, null] }, retirement: [], cardsPlayedThisTurn: 0, hasDrawnThisTurn: false },
      { name: 'Player 2', faction: f2, deck: p2deck, hand: p2deck.splice(0, 5), rows: { Unit: [null, null, null], Location: [null, null, null] }, retirement: [], cardsPlayedThisTurn: 0, hasDrawnThisTurn: false },
    ],
    active: 0,
    roundNumber: 1,
    roundStarter: 0,
    roundWins: [0, 0],
    lastRoundResult: null,
    gameOver: null,
    pendingReveal: null, // set to a player index right after a turn/round pass, to gate the "pass the device" interstitial
    queue: [], pending: null, log: [], turnNo: 1,
  };
  state.players.forEach(p => { p.erased = []; p.limbo = []; });
  builder = null;
  uiOpen = null;
  render();
}

function basePower(cardId) {
  const c = CARD_BY_ID[cardId];
  const p = parseInt(c.power, 10);
  return isNaN(p) ? null : p;
}

// ---- Backgrounds -------------------------------------------------------
const BGFX = { canvas: null, g: null, raf: 0, last: 0, w: 0, h: 0, scene: null };

function applyBackground() {
  const def = BACKGROUNDS.find(b => b.id === settings.bg) || BACKGROUNDS[0];
  const stat = document.getElementById('bgstatic');
  if (stat) stat.style.background = def.css;
  stopBgAnim();
  if (def.animated) startBgAnim(def.id);
}
function sizeCanvas() {
  const c = BGFX.canvas; if (!c) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5); // cap the pixel cost on high-DPI tablets
  BGFX.w = window.innerWidth; BGFX.h = window.innerHeight;
  c.width = Math.round(BGFX.w * dpr); c.height = Math.round(BGFX.h * dpr);
  c.style.width = BGFX.w + 'px'; c.style.height = BGFX.h + 'px';
  BGFX.g.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function startBgAnim(id) {
  const c = document.getElementById('bgfx');
  if (!c || !c.getContext) return;
  BGFX.canvas = c; BGFX.g = c.getContext('2d');
  if (!BGFX.g) return;
  c.style.display = 'block';
  sizeCanvas();
  BGFX.scene = SCENES[id]();
  const loop = t => {
    BGFX.raf = requestAnimationFrame(loop);
    if (document.hidden || t - BGFX.last < 33) return; // ~30fps is plenty for a backdrop
    const dt = Math.min(0.1, (t - (BGFX.last || t)) / 1000);
    BGFX.last = t;
    BGFX.scene.draw(BGFX.g, BGFX.w, BGFX.h, t / 1000, dt);
  };
  BGFX.raf = requestAnimationFrame(loop);
}
function stopBgAnim() {
  if (BGFX.raf) cancelAnimationFrame(BGFX.raf);
  BGFX.raf = 0; BGFX.scene = null; BGFX.last = 0;
  const c = document.getElementById('bgfx');
  if (c && c.style) c.style.display = 'none';
}
function glowSprite(r, rgb) {
  const s = document.createElement('canvas'); s.width = s.height = r * 2;
  const g = s.getContext('2d'), gr = g.createRadialGradient(r, r, 0, r, r, r);
  gr.addColorStop(0, 'rgba(' + rgb + ',1)'); gr.addColorStop(0.35, 'rgba(' + rgb + ',0.45)'); gr.addColorStop(1, 'rgba(' + rgb + ',0)');
  g.fillStyle = gr; g.fillRect(0, 0, r * 2, r * 2);
  return s;
}
function makeStars(n) {
  return Array.from({ length: n }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.3 + 0.3,
    a: Math.random() * 0.6 + 0.3, s: Math.random() * 1.5 + 0.4, p: Math.random() * 6.3 }));
}
function drawStars(g, w, h, stars, t) {
  g.fillStyle = '#fff';
  stars.forEach(st => {
    g.globalAlpha = st.a * (0.55 + 0.45 * Math.sin(t * st.s + st.p));
    g.beginPath(); g.arc(st.x * w, st.y * h, st.r, 0, 6.283); g.fill();
  });
  g.globalAlpha = 1;
}
const SCENES = {
  galaxy() {
    const stars = makeStars(260);
    const blobs = [['150,70,220', 0.30, 0.35, 0.55], ['60,110,230', 0.70, 0.30, 0.45], ['230,80,170', 0.55, 0.70, 0.40], ['90,40,160', 0.20, 0.80, 0.50]];
    const sprites = blobs.map(b => glowSprite(256, b[0]));
    let shoot = null, nextShoot = 6;
    return { draw(g, w, h, t, dt) {
      g.globalCompositeOperation = 'source-over';
      g.fillStyle = '#04030c'; g.fillRect(0, 0, w, h);
      g.globalCompositeOperation = 'lighter';
      blobs.forEach((b, i) => {
        const size = Math.max(w, h) * b[3] * (1 + 0.06 * Math.sin(t * 0.07 + i));
        const x = w * b[1] + Math.sin(t * 0.05 + i * 2) * w * 0.04, y = h * b[2] + Math.cos(t * 0.04 + i) * h * 0.03;
        g.globalAlpha = 0.55; g.drawImage(sprites[i], x - size, y - size, size * 2, size * 2);
      });
      g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
      drawStars(g, w, h, stars, t);
      nextShoot -= dt;
      if (!shoot && nextShoot <= 0) { shoot = { x: Math.random() * w * 0.7, y: Math.random() * h * 0.4, life: 0 }; nextShoot = 8 + Math.random() * 10; }
      if (shoot) {
        shoot.life += dt; const k = shoot.life / 0.9;
        const x = shoot.x + k * w * 0.35, y = shoot.y + k * h * 0.18;
        const grad = g.createLinearGradient(x - 90, y - 45, x, y);
        grad.addColorStop(0, 'rgba(255,255,255,0)'); grad.addColorStop(1, 'rgba(255,255,255,' + (0.9 * (1 - k)) + ')');
        g.strokeStyle = grad; g.lineWidth = 2; g.beginPath(); g.moveTo(x - 90, y - 45); g.lineTo(x, y); g.stroke();
        if (k >= 1) shoot = null;
      }
    } };
  },
  embers() {
    const spr = [glowSprite(24, '255,140,50'), glowSprite(24, '255,90,30'), glowSprite(24, '255,200,120')];
    const make = (fresh) => ({ x: Math.random(), y: fresh ? 1.05 : Math.random() * 1.05, v: 0.03 + Math.random() * 0.06,
      wob: Math.random() * 6.3, ws: 0.6 + Math.random() * 1.2, r: 3 + Math.random() * 7, a: 0.4 + Math.random() * 0.6, k: (Math.random() * 3) | 0 });
    const parts = Array.from({ length: 110 }, () => make(false));
    return { draw(g, w, h, t, dt) {
      const bg = g.createRadialGradient(w / 2, h * 1.1, 0, w / 2, h * 1.1, h * 1.1);
      bg.addColorStop(0, '#6a2410'); bg.addColorStop(0.45, '#260b05'); bg.addColorStop(1, '#070302');
      g.globalCompositeOperation = 'source-over'; g.fillStyle = bg; g.fillRect(0, 0, w, h);
      g.globalCompositeOperation = 'lighter';
      parts.forEach((p, i) => {
        p.y -= p.v * dt; p.wob += p.ws * dt;
        if (p.y < -0.05) parts[i] = make(true);
        const fade = Math.min(1, p.y * 1.4);
        g.globalAlpha = p.a * fade * (0.7 + 0.3 * Math.sin(t * 3 + p.wob));
        const x = (p.x + Math.sin(p.wob) * 0.015) * w, y = p.y * h;
        g.drawImage(spr[p.k], x - p.r, y - p.r, p.r * 2, p.r * 2);
      });
      g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
    } };
  },
  aurora() {
    const stars = makeStars(160).map(s => Object.assign(s, { y: s.y * 0.7 }));
    const bands = [['60,255,170', 0.30, 0.9, 0.00], ['80,200,255', 0.38, 1.3, 1.7], ['170,110,255', 0.24, 0.7, 3.1]];
    return { draw(g, w, h, t) {
      const bg = g.createLinearGradient(0, 0, 0, h);
      bg.addColorStop(0, '#040a16'); bg.addColorStop(0.6, '#071c22'); bg.addColorStop(1, '#030b0e');
      g.globalCompositeOperation = 'source-over'; g.fillStyle = bg; g.fillRect(0, 0, w, h);
      drawStars(g, w, h, stars, t);
      g.globalCompositeOperation = 'lighter';
      bands.forEach((b, bi) => {
        const base = h * b[1], amp = h * 0.06;
        const grad = g.createLinearGradient(0, base - h * 0.22, 0, base + h * 0.12);
        grad.addColorStop(0, 'rgba(' + b[0] + ',0)'); grad.addColorStop(0.6, 'rgba(' + b[0] + ',0.22)'); grad.addColorStop(1, 'rgba(' + b[0] + ',0)');
        g.fillStyle = grad; g.beginPath();
        const step = w / 48;
        for (let x = 0; x <= w + step; x += step) {
          const y = base + Math.sin(x / w * 6.283 * b[2] + t * 0.25 + b[3]) * amp + Math.sin(x / w * 13 + t * 0.4 + bi) * amp * 0.35;
          if (x === 0) g.moveTo(x, y - h * 0.22); else g.lineTo(x, y - h * 0.22);
        }
        for (let x = w + step; x >= 0; x -= step) {
          const y = base + Math.sin(x / w * 6.283 * b[2] + t * 0.25 + b[3]) * amp + Math.sin(x / w * 13 + t * 0.4 + bi) * amp * 0.35;
          g.lineTo(x, y + h * 0.12);
        }
        g.closePath(); g.fill();
      });
      g.globalCompositeOperation = 'source-over';
    } };
  },
};

// ---- Audio: shared graph ------------------------------------------------
const AUD = { ctx: null, master: null, music: null, sfx: null, verb: null, delay: null, noise: null,
  track: null, timer: null, nextBeat: 0, beat: 0, drones: [], lastSfx: {} };

function audioReady() { return !!(AUD.ctx && AUD.ctx.state === 'running'); }
function initAudio() {
  if (AUD.ctx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const ctx = AUD.ctx = new AC();
  AUD.master = ctx.createGain(); AUD.master.connect(ctx.destination);
  AUD.music = ctx.createGain(); AUD.sfx = ctx.createGain();
  // Reverb: a synthetic 2.8s impulse response.
  const len = ctx.sampleRate * 2.8, ir = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
  AUD.verb = ctx.createConvolver(); AUD.verb.buffer = ir;
  const verbOut = ctx.createGain(); verbOut.gain.value = 0.55;
  AUD.verb.connect(verbOut); verbOut.connect(AUD.master);
  // Echo for plucks.
  AUD.delay = ctx.createDelay(2); AUD.delay.delayTime.value = 0.42;
  const fb = ctx.createGain(); fb.gain.value = 0.38;
  const dOut = ctx.createGain(); dOut.gain.value = 0.35;
  AUD.delay.connect(fb); fb.connect(AUD.delay); AUD.delay.connect(dOut); dOut.connect(AUD.master); dOut.connect(AUD.verb);
  AUD.music.connect(AUD.master); AUD.music.connect(AUD.verb);
  AUD.sfx.connect(AUD.master);
  const nb = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate), nd = nb.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  AUD.noise = nb;
  applyVolumes();
}
function applyVolumes() {
  if (!AUD.ctx) return;
  const t = AUD.ctx.currentTime;
  AUD.master.gain.setTargetAtTime(settings.muted ? 0 : 1, t, 0.05);
  AUD.music.gain.setTargetAtTime(Math.pow(settings.musicVol / 100, 2) * 0.9, t, 0.1);
  AUD.sfx.gain.setTargetAtTime(Math.pow(settings.sfxVol / 100, 2) * 1.0, t, 0.05);
}
// Browsers only allow audio after a tap; the first one unlocks it.
function unlockAudio() {
  initAudio();
  if (!AUD.ctx) return;
  if (AUD.ctx.state !== 'running') AUD.ctx.resume().then(() => { if (!AUD.track) playTrack(settings.music); });
  else if (!AUD.track) playTrack(settings.music);
}

// ---- Instruments ------------------------------------------------------
const NOTE = n => 440 * Math.pow(2, (n - 69) / 12); // MIDI note -> Hz
function env(g, t, a, peak, d, sustain) {
  g.gain.setValueAtTime(0.0001, t);

  g.gain.exponentialRampToValueAtTime(Math.max(0.0001, sustain || 0.0001), t + a + d);
}

  out.gain.setValueAtTime(0.0001, t);

  out.gain.setValueAtTime((o.vol || 0.07) / Math.sqrt(notes.length), t + dur - 0.2);
  out.gain.exponentialRampToValueAtTime(0.0001, t + dur + (o.release || 2.2));
  f.connect(out); out.connect(AUD.music);

    const osc = ctx.createOscillator(); osc.type = o.wave || 'sawtooth';
    osc.frequency.value = NOTE(n); osc.detune.value = det;
    osc.connect(f); osc.start(t); osc.stop(t + dur + (o.release || 2.2) + 0.1);
  }));
}

    const osc = ctx.createOscillator(), g = ctx.createGain();

function drum(t, f0, vol, bus) {

  osc.type = 'sine'; osc.frequency.setValueAtTime(f0, t); osc.frequency.exponentialRampToValueAtTime(f0 * 0.45, t + 0.35);
  env(g, t, 0.004, vol, 0.45);

function tone(t, f0, f1, dur, vol, wave, bus) {
  const ctx = AUD.ctx, osc = ctx.createOscillator(), g = ctx.createGain();

function drone(notes, o) {
  const ctx = AUD.ctx, f = ctx.createBiquadFilter(), g = ctx.createGain(), lfo = ctx.createOscillator(), lg = ctx.createGain();

// ===================================================================
// Card animations: draw (Deck -> hand) and Retire (card -> Retire pile)
// -------------------------------------------------------------------
// render() rebuilds the board, so animations use a floating copy of the
// card drawn above everything. Actions queue an animation (capturing where
// the card was, if it's about to vanish); after render() the copy flies to
// where the card now sits. The real hand card stays hidden until it lands.
// ===================================================================
const ANIM = { queue: [], hidden: new Set(), from: {} };
function animOn() { return typeof document !== 'undefined' && !!document.querySelector && !!document.body; }
function rectOf(sel) {
  if (!animOn()) return null;
  const el = document.querySelector(sel);
  if (!el) return null;
  const r = el.getBoundingClientRect();
  return r.width ? { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height } : null;
}

}
function queueAnim(a) {

}
function runAnims() {

}
function scaleNow() {
  const w = document.getElementById('scale-wrapper');

}
function reveal(id) {

}
function playAnim(a) {
  let from, to, rotTo = 0;
  if (a.kind === 'draw') {
    from = rectOf('[data-pile="deck-' + a.pIdx + '"]');
    const target = document.querySelector('[data-inst="' + a.id + '"]');
    to = rectOf('[data-inst="' + a.id + '"]');
    if (target) rotTo = parseFloat(target.getAttribute('data-rot')) || 0;
    if (to) { const w = 175 * scaleNow(); to = Object.assign(to, { w, h: w / 0.7145 }); }
  } else {
    from = a.from || null;
    to = rectOf('[data-pile="' + (a.kind === 'toDeck' ? 'deck-' : 'retire-') + a.pIdx + '"]');
    if (to) { const w = to.w * 0.92; to = Object.assign(to, { w, h: w / 0.7145 }); }
  }

  const el = document.createElement('div');
  el.className = 'fly-card' + (a.kind === 'draw' ? ' flip' : '');
  el.style.width = W + 'px'; el.style.height = H + 'px';
  el.innerHTML = '<div class="fly-inner"><div class="fly-face fly-front">' + establishedCardHtml(a.cardId, { width: 175 }) + '</div>' +
    (a.kind === 'draw' ? '<div class="fly-face fly-back">' + cardBackHtml() + '</div>' : '') + '</div>';
  document.body.appendChild(el);
  const at = (p, s, rot) => 'translate(' + (p.x - W / 2) + 'px,' + (p.y - H / 2) + 'px) scale(' + s + ') rotate(' + rot + 'deg)';
  const lift = { x: (from.x + to.x) / 2, y: Math.min(from.y, to.y) - 60 * scaleNow() };
  const dur = a.kind === 'draw' ? 560 : 480;
  const fly = el.animate(a.kind === 'draw'
    ? [{ transform: at(from, s0, 0) }, { transform: at(lift, 1.08, rotTo / 2), offset: 0.55 }, { transform: at(to, 1, rotTo) }]
    : [{ transform: at(from, s0, 0), filter: 'none', opacity: 1 },
       { transform: at(lift, (s0 + 1) / 2, -6), offset: 0.45 },
       { transform: at(to, 1, 0), filter: 'grayscale(0.75) brightness(0.55)', opacity: 0.95 }],
    { duration: dur, easing: 'cubic-bezier(.25,.8,.3,1)', fill: 'forwards' });
  if (a.kind === 'draw') el.querySelector('.fly-inner').animate(
    [{ transform: 'rotateY(180deg)' }, { transform: 'rotateY(180deg)', offset: 0.25 }, { transform: 'rotateY(0deg)' }],
    { duration: dur, easing: 'ease-in-out', fill: 'forwards' });
  fly.onfinish = () => {
    el.remove();
    if (a.kind === 'draw') reveal(a.id);
    else {
      const box = document.querySelector('[data-pile="' + (a.kind === 'toDeck' ? 'deck-' : 'retire-') + a.pIdx + '"]');
      if (box && box.animate) box.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.06)' }, { transform: 'scale(1)' }], { duration: 260 });
    }
  };
}

// ===================================================================
// Ability engine
// -------------------------------------------------------------------
// SCRIPTS (generated from the master CSV by tools/scripts_from_text.py)
// lists each card's automated abilities. Anything not in SCRIPTS stays
// manual: the +/- Power steppers and drag-to-Retire still work on every
// card, so an unscripted ability is always playable by hand.
//
// Flow: an action (play, retire, draw...) queues triggered abilities in
// state.queue. runQueue() resolves them in order. An ability that needs
// a decision (a target, a "you may", a card from a list) parks itself in
// state.pending and waits for the player. Per the Core Rules, all
// triggers finish before the next action, and only then do Zero-Power
// Retirement, Conflict Start and end-of-turn get checked (settle()).
// Everything lives in `state`, so saves resume mid-prompt.
// ===================================================================

function scriptsOf(cardId) { return SCRIPTS[cardId] || []; }
function abilitiesWith(cardId, trig) {
  return scriptsOf(cardId).map((a, i) => ({ a, i })).filter(x => x.a.trig === trig);
}
function hasTrig(cardId, trig) { return scriptsOf(cardId).some(a => a.trig === trig); }
function cardOf(inst) { return CARD_BY_ID[inst.cardId]; }
function nameOf(inst) { return cardOf(inst).name; }

function busy() { return !!(state && (state.pending || (state.queue && state.queue.length))); }

}

// Every card on the board, with where it sits.
function boardCards(pIdx) {
  const out = [];
  const pl = pIdx === undefined ? [0, 1] : [pIdx];
  pl.forEach(pi => ROW_TYPES.forEach(row => state.players[pi].rows[row].forEach((inst, slot) => {
    if (inst) out.push({ inst, pIdx: pi, row, slot });
  })));
  return out;
}
function findOnBoard(instanceId) {
  return boardCards().find(b => b.inst.instanceId === instanceId) || null;
}
// Find an instance anywhere (board, hand, deck, piles).
function findAnywhere(instanceId) {
  const b = findOnBoard(instanceId);
  if (b) return Object.assign({ zone: 'board' }, b);
  for (let pi = 0; pi < 2; pi++) {
    const p = state.players[pi];
    for (const zone of ['hand', 'deck', 'retirement', 'erased']) {
      const idx = (p[zone] || []).findIndex(i => i.instanceId === instanceId);
      if (idx >= 0) return { zone, pIdx: pi, idx, inst: p[zone][idx] };
    }
  }

}

// ---- Counts used by scaling and conditions ------------------------
function countFor(key, pIdx, srcInst) {
  const p = state.players[pIdx], o = state.players[other(pIdx)];
  const n = arr => arr.filter(Boolean).length;
  switch (key) {
    case 'ownLocations': return n(p.rows.Location);
    case 'ownUnits': return n(p.rows.Unit);
    case 'ownOtherUnits': return p.rows.Unit.filter(u => u && (!srcInst || u.instanceId !== srcInst.instanceId)).length;
    case 'ownRetiredUnits': return p.retirement.filter(i => cardOf(i).type === 'Unit').length;
    case 'oppUnits': return n(o.rows.Unit);
    case 'allRetired': return p.retirement.length + o.retirement.length;
    case 'opposingLocations': return [0, 1, 2].filter(i => o.rows.Location[i] && (p.rows.Location[i] || p.rows.Unit[i])).length;
    case 'handSize': return p.hand.length;

}
function condOk(cond, pIdx, srcInst) {
  if (!cond) return true;
  const v = countFor(cond.count, pIdx, srcInst);
  if (cond.min !== undefined && v < cond.min) return false;
  if (cond.max !== undefined && v > cond.max) return false;
  return true;
}

// ---- Power ----------------------------------------------------------
// inst.power  = counters plus manual stepper changes (lasts until it leaves play)
// inst.cb     = "During the next Conflict" bonus (cleared after Conflict)
// statics     = continuous "for each" bonuses, recomputed every time
function staticBonus(inst) {

  abilitiesWith(inst.cardId, 'static').forEach(({ a }) => {
    if (a.eff.kind !== 'perCount') return;
    let v = a.eff.amount * countFor(a.eff.count, b.pIdx, inst);

}

  return total;
}

function changePower(inst, delta, field) {

    const s = Math.min(inst.shield, -delta);
    inst.shield -= s; delta += s;
    if (s) logMsg(nameOf(inst) + ' prevented ' + s + ' Power loss.');

// ---- Drawing, with the Retirement-pile reshuffle ---------------------
function drawOne(pIdx) {
  const p = state.players[pIdx];
  if (p.deck.length === 0 && p.retirement.length > 0) {
    p.deck = shuffle(p.retirement);
    p.retirement = [];
    logMsg(p.name + ' shuffled their Retirement pile into their Deck.');
  }
  if (p.deck.length === 0) return null; // nothing to draw: the draw is skipped

  return inst;

function topOfDeck(pIdx, n) {

    p.deck = p.deck.concat(shuffle(p.retirement));
    p.retirement = [];
  }
  return p.deck.slice(0, n);

// ---- Targets ----------------------------------------------------------

  const side = spec.side === 'own' ? controller : other(controller);
  let list = boardCards(side).filter(b => b.row === spec.row);
  if (spec.otherThanSource) list = list.filter(b => b.inst.instanceId !== srcId);
  if (spec.maxPower !== undefined) list = list.filter(b => (currentPower(b.inst) || 0) <= spec.maxPower);
  if (side !== controller) {
    if (sign < 0) list = list.filter(b => !isProtected(b.inst));
    const bait = list.filter(b => isBait(b.inst));
    if (bait.length) list = bait; // Bait: opponents must choose it if able
  }
  return list;
}
// Targets that need no choice ("each", "the opposing", "this").
function autoTargets(spec, controller, srcId) {
  const src = findOnBoard(srcId);
  if (spec.sel === 'self') return src ? [src] : [];
  if (spec.sel === 'each') {
    const side = spec.side === 'own' ? controller : other(controller);
    let list = boardCards(side).filter(b => b.row === spec.row);
    if (spec.otherThanSource) list = list.filter(b => b.inst.instanceId !== srcId);
    if (spec.maxPower !== undefined) list = list.filter(b => (currentPower(b.inst) || 0) <= spec.maxPower);
    return list;
  }
  if (spec.sel === 'opposing') {
    if (!src) return [];
    const o = state.players[other(src.pIdx)].rows[spec.row][src.slot];
    return o ? [{ inst: o, pIdx: other(src.pIdx), row: spec.row, slot: src.slot }] : [];
  }
  if (spec.sel === 'eachOpposing') {
    const me = state.players[controller], opp = other(controller);
    return [0, 1, 2].filter(i => (me.rows.Unit[i] || me.rows.Location[i]) && state.players[opp].rows[spec.row][i])
      .map(i => ({ inst: state.players[opp].rows[spec.row][i], pIdx: opp, row: spec.row, slot: i }));

// ---- Triggers and the queue -----------------------------------------
function queueAbility(inst, owner, abIdx, extra) {

}
function fire(trig, ctx) {

    case 'enter': case 'play': case 'retiredSelf': case 'leavesPlay':
      queueFor(ctx.inst, ctx.owner); break;
    case 'ownUnitPlayed': case 'ownLocationPlayed': case 'ownUnitRetired': case 'turnStart': case 'ownDiscard':
      boardCards(ctx.owner).forEach(b => queueFor(b.inst, ctx.owner)); break;
    case 'unitStationedHere': {
      const loc = state.players[ctx.owner].rows.Location[ctx.slot];
      if (loc) queueFor(loc, ctx.owner);
      break;
    }
    case 'opposingUnitRetired': {
      const opp = other(ctx.owner);
      const u = state.players[opp].rows.Unit[ctx.slot];
      if (u) queueFor(u, opp);
      break;
    }
  }
}

// A card leaves the board through Retirement (not cleanup — cleanup triggers nothing).
function retireFromBoard(pIdx, row, slot, why) {
  const p = state.players[pIdx];
  const inst = p.rows[row][slot];
  if (!inst) return;
  rememberSpot(inst.instanceId);
  p.rows[row][slot] = null;
  inst.power = 0; inst.cb = 0; inst.shield = 0;
  if (hasTrig(inst.cardId, 'duty')) {
    state.queue.unshift({ kind: 'duty', src: inst.instanceId, controller: pIdx, row, slot, why });
    p.limbo = p.limbo || [];
    p.limbo.push(inst); // held until Duty is decided
    return;
  }
  finishRetire(pIdx, inst, row, slot);
}
function finishRetire(pIdx, inst, row, slot) {
  state.players[pIdx].retirement.push(inst);
  logMsg(nameOf(inst) + ' was Retired.');
  sfx('retire');
  queueAnim({ kind: 'retire', cardId: inst.cardId, pIdx, from: ANIM.from[inst.instanceId] });
  delete ANIM.from[inst.instanceId];
  fire('leavesPlay', { inst, owner: pIdx });
  fire('retiredSelf', { inst, owner: pIdx });
  if (row === 'Unit') {
    fire('ownUnitRetired', { owner: pIdx });
    fire('opposingUnitRetired', { owner: pIdx, slot });
  }
}
function takeFromLimbo(pIdx, instanceId) {
  const p = state.players[pIdx];
  const i = (p.limbo || []).findIndex(x => x.instanceId === instanceId);
  return i >= 0 ? p.limbo.splice(i, 1)[0] : null;
}

function runQueue() {
  let guard = 0;
  while (!state.pending && state.queue.length && guard++ < 500) {
    resolveTask(state.queue.shift());
  }
  if (!state.pending && !state.queue.length) settle();
}

// After everything resolves: Zero-Power Retirement, then Conflict Start, then auto end of turn.
function settle() {
  if (state.gameOver) return;
  const dead = boardCards().filter(b => { const v = currentPower(b.inst); return v !== null && v <= 0; });
  if (dead.length) {
    dead.forEach(b => { logMsg(nameOf(b.inst) + ' fell to 0 Power.'); retireFromBoard(b.pIdx, b.row, b.slot, 'zero'); });
    runQueue();
    return;
  }
  checkConflictTrigger(); // Conflict is state-based and still starts automatically; ending the turn is the player's call
}

function ask(p) { state.pending = p; sfx('prompt'); }
function who(pIdx) { return state.players[pIdx].name + ': '; }

function resolveTask(t) {
  if (t.kind === 'duty') return resolveDuty(t);
  const ab = scriptsOf(t.cardId)[t.ab];
  if (!ab || !ab.eff) return;
  const eff = ab.eff, ctl = t.controller;
  const srcCard = CARD_BY_ID[t.cardId];
  const srcInst = (findAnywhere(t.src) || {}).inst;
  if (!t.condChecked) {
    t.condChecked = true;
    if (!condOk(ab.cond, ctl, srcInst)) { logMsg(srcCard.name + ': condition not met.'); return; }
  }
  const choosesTarget = eff.target && eff.target.sel === 'target' || eff.kind === 'swing';
  const choosesFromList = ['eraseFromPiles', 'switchSearch', 'pileToHand', 'scry'].includes(eff.kind);
  if (ab.optional && !t.confirmed && !choosesTarget && !choosesFromList) {
    return ask({ type: 'confirm', task: t, text: who(ctl) + srcCard.name + ' — use this ability?', detail: srcCard.ability });
  }
  const sign = (eff.amount || 0) < 0 || eff.kind === 'swing' ? -1 : 1;

  // Effects that apply to a chosen target.
  if (choosesTarget && !t.choice) {
    const spec = eff.kind === 'swing' ? { sel: 'target', side: 'own', row: eff.row } : eff.target;
    const legal = legalTargets(spec, ctl, t.src, eff.kind === 'swing' ? 1 : sign);
    if (!legal.length) { logMsg(srcCard.name + ': no legal target.'); return; }
    return ask({ type: 'target', task: t, legal: legal.map(b => b.inst.instanceId), optional: !!ab.optional,
      text: who(ctl) + srcCard.name + ' — choose target ' + spec.row + (spec.side === 'own' ? ' you control' : ' an opponent controls') });
  }
  const chosen = t.choice ? findOnBoard(t.choice) : null;
  if (choosesTarget && !chosen) { logMsg(srcCard.name + ': target left play.'); return; }

  switch (eff.kind) {
    case 'counters': case 'conflictBonus': {
      let amount = eff.amount;
      if (eff.perCount) amount *= Math.floor(countFor(eff.perCount, ctl, srcInst) / (eff.div || 1));
      if (!amount) { logMsg(srcCard.name + ': nothing to add.'); return; }
      const field = eff.kind === 'conflictBonus' ? 'cb' : 'power';
      const targets = chosen ? [chosen] : autoTargets(eff.target, ctl, t.src);
      targets.forEach(b => changePower(b.inst, amount, field));
      logMsg(srcCard.name + ': ' + (amount > 0 ? '+' : '') + amount + (field === 'cb' ? ' next Conflict' : '') +
        ' to ' + (targets.length ? targets.map(b => nameOf(b.inst)).join(', ') : 'nothing') + '.');
      return;
    }
    case 'swing': {
      const field = eff.conflict ? 'cb' : 'power';
      changePower(chosen.inst, eff.plus, field);
      const opp = state.players[other(chosen.pIdx)].rows[chosen.row][chosen.slot];
      if (opp) changePower(opp, -eff.minus, field);
      logMsg(srcCard.name + ': +' + eff.plus + ' ' + nameOf(chosen.inst) + (opp ? ', -' + eff.minus + ' ' + nameOf(opp) : ' (no opposing card)') + '.');
      return;
    }
    case 'shield':
      chosen.inst.shield = (chosen.inst.shield || 0) + eff.amount;
      logMsg(nameOf(chosen.inst) + ' will prevent the next ' + eff.amount + ' Power loss this turn.');
      return;
    case 'returnToHand': {
      const b = chosen;
      state.players[b.pIdx].rows[b.row][b.slot] = null;
      b.inst.power = 0; b.inst.cb = 0; b.inst.shield = 0;
      state.players[b.pIdx].hand.push(b.inst);
      logMsg(nameOf(b.inst) + ' returned to hand.');
      fire('leavesPlay', { inst: b.inst, owner: b.pIdx });
      return;
    }
    case 'revealGamble': {
      const top = topOfDeck(ctl, 1)[0];
      if (!top) { logMsg(srcCard.name + ': nothing to reveal.'); return; }
      const hit = cardOf(top).type === 'Unit';
      changePower(chosen.inst, hit ? eff.plus : -eff.minus);
      logMsg(srcCard.name + ': revealed ' + nameOf(top) + ' — ' + nameOf(chosen.inst) + (hit ? ' +' + eff.plus : ' -' + eff.minus) + '.');
      return;
    }
    case 'draw': {
      let got = 0;
      for (let i = 0; i < eff.n; i++) { const d = drawOne(ctl); if (d) { got++; if (ctl === state.active) queueAnim({ kind: 'draw', id: d.instanceId, cardId: d.cardId, pIdx: ctl }); } }
      if (got) sfx('draw');
      logMsg(state.players[ctl].name + ' drew ' + got + ' (' + srcCard.name + ').');
      return;
    }
    case 'highStakes': {
      const top = topOfDeck(ctl, 1)[0];
      if (!srcInst || !findOnBoard(srcInst.instanceId)) return;
      if (!top) { logMsg('High Stakes: nothing to reveal.'); return; }
      if (cardOf(top).type === 'Unit') {
        changePower(srcInst, 3);
        logMsg('High Stakes: revealed ' + nameOf(top) + ' (Unit) — ' + srcCard.name + ' +3.');
      } else {
        state.players[ctl].deck.shift();
        state.players[ctl].retirement.push(top);
        changePower(srcInst, -1);
        logMsg('High Stakes: revealed ' + nameOf(top) + ' — Retired it; ' + srcCard.name + ' -1.');
      }
      return;
    }
    case 'peek': {
      const top = topOfDeck(ctl, 1);
      if (!top.length) return;
      return ask({ type: 'list', task: Object.assign(t, { done: true }), text: who(ctl) + 'Top card of your Deck (' + srcCard.name + ')',
        options: top.map(i => i.instanceId), min: 0, max: 0, selected: [] });
    }
  }

  // Effects that pick cards from a list.
  if (t.picked === undefined) {
    let options = [], min = 0, max = 1, text = '';
    const p = state.players[ctl];
    switch (eff.kind) {
      case 'eraseFromPiles':
        options = state.players[0].retirement.concat(state.players[1].retirement);
        max = eff.max; text = 'Scrap Value — you may Erase a card from any Retirement pile';
        break;
      case 'switchSearch': {
        const floor = basePower(t.cardId) || 0;
        options = p.deck.filter(i => cardOf(i).type === 'Unit' && (basePower(i.cardId) || 0) > floor);
        text = 'Switch — you may put a higher-Power Unit from your Deck on top';
        break;
      }
      case 'pileToHand':
        options = p.retirement.filter(i => cardOf(i).type === eff.filter);
        min = 1; text = srcCard.name + ' — return a ' + eff.filter + ' from your Retirement pile to your hand';
        break;
      case 'lookTop':
        options = topOfDeck(ctl, eff.n); min = max = Math.min(eff.toHand, options.length);
        text = srcCard.name + ' — choose ' + eff.toHand + ' for your hand' + (eff.rest === 'bottom' ? '; the rest go to the bottom' : '');
        break;
      case 'scry':
        options = topOfDeck(ctl, eff.n);
        text = srcCard.name + ' — tap the card to put it on the bottom, or leave it on top';
        break;
      case 'discardThenDraw':
        options = p.hand.slice(); min = max = Math.min(1, options.length);
        text = srcCard.name + ' — discard a card, then draw a card';
        break;
      default:
        logMsg(srcCard.name + ': not automated.');
        return;
    }
    if (!options.length && min === 0) { logMsg(srcCard.name + ': nothing to choose.'); return; }
    if (!options.length) { if (eff.kind === 'discardThenDraw') { t.picked = []; } else { logMsg(srcCard.name + ': nothing to choose.'); return; } }
    else return ask({ type: 'list', task: t, text: who(ctl) + text, options: options.map(i => i.instanceId), min, max, selected: [] });
  }
  applyPicked(t, eff, ctl, srcCard, srcInst);
}

function removeFrom(arr, id) { const i = arr.findIndex(x => x.instanceId === id); return i >= 0 ? arr.splice(i, 1)[0] : null; }

function applyPicked(t, eff, ctl, srcCard, srcInst) {
  const p = state.players[ctl];
  const picked = t.picked || [];
  switch (eff.kind) {
    case 'eraseFromPiles': {
      picked.forEach(id => {
        for (let pi = 0; pi < 2; pi++) {
          const inst = removeFrom(state.players[pi].retirement, id);
          if (inst) { state.players[pi].erased.push(inst); logMsg(nameOf(inst) + ' was Erased.'); sfx('erase'); }
        }
      });
      if (picked.length && srcInst && findOnBoard(srcInst.instanceId)) changePower(srcInst, eff.perCounter * picked.length);
      return;
    }
    case 'switchSearch': {
      if (!picked.length) return;
      const inst = removeFrom(p.deck, picked[0]);
      p.deck = shuffle(p.deck);
      p.deck.unshift(inst);
      logMsg('Switch: ' + nameOf(inst) + ' put on top of the Deck.');
      return;
    }
    case 'pileToHand':
      picked.forEach(id => { const inst = removeFrom(p.retirement, id); if (inst) { p.hand.push(inst); logMsg(nameOf(inst) + ' returned to hand.'); } });
      return;
    case 'lookTop': {
      const looked = p.deck.splice(0, eff.n);
      looked.forEach(inst => {
        if (picked.includes(inst.instanceId)) { inst.drawnTurn = state.turnNo; p.hand.push(inst); }
        else if (eff.rest === 'bottom') p.deck.push(inst);
        else p.deck.unshift(inst);
      });
      logMsg(srcCard.name + ': took a card into hand.');
      return;
    }
    case 'scry':
      if (picked.length) { const inst = removeFrom(p.deck, picked[0]); p.deck.push(inst); logMsg(srcCard.name + ': put the top card on the bottom.'); }
      return;
    case 'discardThenDraw':
      picked.forEach(id => { const inst = removeFrom(p.hand, id); if (inst) { p.retirement.push(inst); logMsg(p.name + ' discarded ' + nameOf(inst) + '.'); fire('ownDiscard', { owner: ctl }); } });
      drawOne(ctl);
      return;
  }
}

function resolveDuty(t) {
  const inst = (state.players[t.controller].limbo || []).find(x => x.instanceId === t.src);
  if (!inst) return;
  if (t.answer === undefined) {
    return ask({ type: 'confirm', task: t, text: who(t.controller) + 'Duty — shuffle ' + nameOf(inst) + ' into your Deck instead of Retiring it?' });
  }
  takeFromLimbo(t.controller, t.src);
  if (t.answer) {
    const p = state.players[t.controller];
    p.deck.push(inst); p.deck = shuffle(p.deck);
    logMsg('Duty: ' + nameOf(inst) + ' was shuffled into the Deck.');
    queueAnim({ kind: 'toDeck', cardId: inst.cardId, pIdx: t.controller, from: ANIM.from[inst.instanceId] });
    delete ANIM.from[inst.instanceId];
    fire('leavesPlay', { inst, owner: t.controller });
  } else {
    finishRetire(t.controller, inst, t.row, t.slot);
  }
}

// ---- Player responses to prompts --------------------------------------
function answerPending(yes) {
  const pd = state.pending; if (!pd) return;
  pickZoom = null;
  const t = pd.task;
  state.pending = null;
  if (t.kind === 'duty') { t.answer = !!yes; resolveTask(t); }
  else if (pd.type === 'confirm') { if (yes) { t.confirmed = true; resolveTask(t); } else logMsg(CARD_BY_ID[t.cardId].name + ': declined.'); }
  else if (pd.type === 'target') { logMsg(CARD_BY_ID[t.cardId].name + ': skipped.'); }
  else if (pd.type === 'list') {
    if (t.done) { /* info only */ }
    else if (!yes) { t.picked = []; resolveTask(t); }
    else { t.picked = pd.selected.slice(); resolveTask(t); }
  }
  runQueue(); render();
}
function chooseTarget(instanceId) {
  const pd = state.pending;
  if (!pd || pd.type !== 'target' || !pd.legal.includes(instanceId)) return false;
  state.pending = null;
  pd.task.choice = instanceId; pd.task.confirmed = true;
  resolveTask(pd.task);
  runQueue(); render();
  return true;
}
function togglePick(instanceId) {
  const pd = state.pending;
  if (!pd || pd.type !== 'list' || pd.max === 0) return;
  const i = pd.selected.indexOf(instanceId);
  if (i >= 0) pd.selected.splice(i, 1);
  else { if (pd.selected.length >= pd.max) pd.selected.shift(); pd.selected.push(instanceId); }
  render();
}

// ---- Play restrictions -----------------------------------------------
function canPlayCard(pIdx, inst) {
  const reqs = abilitiesWith(inst.cardId, 'playReq').map(x => x.a);
  for (const r of reqs) {
    if (r.req === 'notDrawnThisTurn' && inst.drawnTurn === state.turnNo) return false;
    if (r.req === 'controlLocation' && countFor('ownLocations', pIdx) < 1) return false;
    if (r.req === 'minRetired' && state.players[pIdx].retirement.length < r.n) return false;
  }
  return true;
}

// ---- Save compatibility ------------------------------------------------
function upgradeState(s) {
  s.queue = s.queue || []; s.pending = s.pending || null; s.log = s.log || [];
  s.turnNo = s.turnNo || 1;
  s.players.forEach((p, pi) => { p.erased = p.erased || []; p.limbo = p.limbo || []; });
  return s;
}

function draw(pIdx) {
  if (state.gameOver || busy()) return;
  const p = state.players[pIdx];
  if (pIdx !== state.active) return; // only the active player may draw
  if (p.hasDrawnThisTurn) return; // one draw per turn
  const drawn = drawOne(pIdx);
  if (drawn) { sfx('draw'); queueAnim({ kind: 'draw', id: drawn.instanceId, cardId: drawn.cardId, pIdx }); } // reshuffles the Retirement pile if the Deck is empty; skipped if both are empty
  p.hasDrawnThisTurn = true;
  runQueue();
  render();
}

function playToSlot(pIdx, handIdx, rowType, slotIdx) {
  if (state.gameOver || busy()) return;
  const p = state.players[pIdx];
  if (pIdx !== state.active) return; // only the active player may play
  if (p.cardsPlayedThisTurn >= MAX_PLAYS_PER_TURN) return; // play limit
  if (!canPlayCard(pIdx, p.hand[handIdx])) return;
  const [inst] = p.hand.splice(handIdx, 1);
  if (p.rows[rowType][slotIdx]) retireFromBoard(pIdx, rowType, slotIdx, 'overwrite');
  p.rows[rowType][slotIdx] = inst;
  inst.power = 0; inst.cb = 0; inst.shield = 0;
  p.cardsPlayedThisTurn++;
  uiOpen = null;
  logMsg(p.name + ' played ' + nameOf(inst) + '.');
  sfx('play');
  fire('enter', { inst, owner: pIdx });
  if (rowType === 'Unit') {
    fire('ownUnitPlayed', { owner: pIdx });
    fire('unitStationedHere', { owner: pIdx, slot: slotIdx });
  } else {
    fire('ownLocationPlayed', { owner: pIdx });
  }
  runQueue();
  render();
}

function playEvent(pIdx, handIdx) {
  if (state.gameOver || busy()) return;
  const p = state.players[pIdx];
  if (pIdx !== state.active) return; // only the active player may play
  if (p.cardsPlayedThisTurn >= MAX_PLAYS_PER_TURN) return; // play limit
  rememberSpot(p.hand[handIdx].instanceId);
  const [inst] = p.hand.splice(handIdx, 1);
  // Events resolve immediately and never occupy a slot: straight to the Retirement pile.
  queueAnim({ kind: 'retire', cardId: inst.cardId, pIdx, from: ANIM.from[inst.instanceId] });
  delete ANIM.from[inst.instanceId];
  p.retirement.push(inst);
  p.cardsPlayedThisTurn++;
  uiOpen = null;
  logMsg(p.name + ' played ' + nameOf(inst) + '.');
  sfx('event');
  fire('play', { inst, owner: pIdx });
  runQueue();
  render();
}

function returnToHand(pIdx, rowType, slotIdx) {
  if (state.gameOver || busy()) return;
  const p = state.players[pIdx];
  const inst = p.rows[rowType][slotIdx];
  if (!inst) return;
  inst.power = 0; inst.cb = 0; inst.shield = 0;
  p.rows[rowType][slotIdx] = null;
  p.hand.push(inst);
  // Undoing a play frees up the play count it used, so a misclick doesn't cost a turn action.
  if (pIdx === state.active && p.cardsPlayedThisTurn > 0) p.cardsPlayedThisTurn--;
  uiOpen = null;
  render();
}

function retireSlot(pIdx, rowType, slotIdx) {
  if (state.gameOver || busy()) return;
  if (!state.players[pIdx].rows[rowType][slotIdx]) return;
  retireFromBoard(pIdx, rowType, slotIdx, 'manual');
  uiOpen = null;
  runQueue();
  render();
}

function adjustPower(pIdx, rowType, slotIdx, delta) {
  if (state.gameOver) return;
  const inst = state.players[pIdx].rows[rowType][slotIdx];
  if (!inst) return;
  inst.power = (inst.power || 0) + delta;
  sfx(delta > 0 ? 'up' : 'down');
  render();
}

function retirementReturn(pIdx, i) {
  if (state.gameOver) return;
  const p = state.players[pIdx];
  const [inst] = p.retirement.splice(i, 1);
  inst.power = 0;
  p.hand.push(inst);
  render();
}

// The three mandatory actions: draw 1, play 2. A draw that can't happen (empty
// Deck and Retirement pile) is skipped, and plays count as done once no card
// in hand can legally be played, so a turn can never get stuck.
function hasLegalPlay(pIdx) {
  const p = state.players[pIdx];
  return p.hand.some(inst => cardOf(inst).type === 'Event' || canPlayCard(pIdx, inst));
}
function turnStatus(pIdx) {
  const p = state.players[pIdx];
  const drawDone = p.hasDrawnThisTurn || (p.deck.length === 0 && p.retirement.length === 0);
  const playsDone = p.cardsPlayedThisTurn >= MAX_PLAYS_PER_TURN || !hasLegalPlay(pIdx);
  return { drawDone, playsDone, ready: drawDone && playsDone };
}
function canEndTurn() {
  return !!state && !state.gameOver && !busy() && state.pendingReveal === null && turnStatus(state.active).ready;
}
function passTurn() {
  if (!canEndTurn()) return;
  logMsg(state.players[state.active].name + ' ended their turn.');
  sfx('endturn');
  endTurn();
}
function maybeAutoEndTurn(pIdx) {
  if (pIdx !== state.active) return;
  const p = state.players[pIdx];
  if (p.cardsPlayedThisTurn >= MAX_PLAYS_PER_TURN && p.hasDrawnThisTurn) {
    endTurn();
  }
}

function endTurn() {
  if (state.gameOver) return;
  const cur = state.players[state.active], oth = state.players[other(state.active)];
  boardCards().forEach(b => { b.inst.shield = 0; }); // "this turn" shields expire
  // Core Rules: if another player has an empty hand, the current player puts their hand on the bottom of their Deck.
  if (oth.hand.length === 0 && cur.hand.length > 0) {
    cur.deck = cur.deck.concat(cur.hand);
    cur.hand = [];
    logMsg(cur.name + ' put their hand on the bottom of their Deck.');
    if (checkConflictTrigger()) return;
  }
  state.active = other(state.active);
  state.turnNo = (state.turnNo || 1) + 1;
  const next = state.players[state.active];
  next.cardsPlayedThisTurn = 0;
  next.hasDrawnThisTurn = false;
  uiOpen = null;
  state.pendingReveal = state.active;
  fire('turnStart', { owner: state.active });
  runQueue();
  render();
}

// Returns true if a Conflict round was triggered and handled (caller should
// stop — resolveConflict() does its own render()); false otherwise.
function checkConflictTrigger() {
  if (state.players[0].hand.length === 0 && state.players[1].hand.length === 0) {
    resolveConflict();
    return true;
  }
  return false;
}

function resolveConflict() {
  sfx('conflict');
  const t0 = totalPower(0), t1 = totalPower(1);
  let winnerIdx = t0 === t1 ? null : (t0 > t1 ? 0 : 1);
  let tieNote = '';
  if (winnerIdx === null) {
    // Core Rules tiebreak: highest-Power Unit, then up to three deck reveals.
    const best = pi => Math.max(0, ...state.players[pi].rows.Unit.filter(Boolean).map(u => conflictPower(u) || 0));
    const b0 = best(0), b1 = best(1);
    if (b0 !== b1) {
      winnerIdx = b0 > b1 ? 0 : 1;
      tieNote = 'Tie broken by the highest-Power Unit (' + Math.max(b0, b1) + ').';
    } else {
      for (let r = 0; r < 3 && winnerIdx === null; r++) {
        const rv = [0, 1].map(pi => { const top = topOfDeck(pi, 1)[0]; return top ? (basePower(top.cardId) || 0) : 0; });
        [0, 1].forEach(pi => { state.players[pi].deck = shuffle(state.players[pi].deck); });
        if (rv[0] !== rv[1]) { winnerIdx = rv[0] > rv[1] ? 0 : 1; tieNote = 'Tie broken by a deck reveal (' + rv[0] + ' vs ' + rv[1] + ').'; }
      }
      if (winnerIdx === null) tieNote = 'Still tied after three reveals: no one wins the round.';
    }
  }
  if (winnerIdx !== null) state.roundWins[winnerIdx]++;
  if (winnerIdx !== null) setTimeout(() => sfx(state && state.gameOver ? 'victory' : 'win'), 900);

  state.lastRoundResult = { roundNumber: state.roundNumber, totals: [t0, t1], winnerIdx, roundWins: state.roundWins.slice(), tieNote };

  if (winnerIdx !== null && state.roundWins[winnerIdx] >= ROUNDS_TO_WIN_GAME) {
    state.gameOver = { winnerIdx };
    render();
    return;
  }

  // Cleanup: every Unit retires to its owner's pile; Locations remain; nothing triggers.
  state.players.forEach(p => {
    p.rows.Unit.forEach((inst, i) => {
      if (!inst) return;
      inst.power = 0; inst.cb = 0; inst.shield = 0;
      p.retirement.push(inst);
      p.rows.Unit[i] = null;
    });
    p.rows.Location.forEach(inst => { if (inst) { inst.cb = 0; inst.shield = 0; } }); // "next Conflict" bonuses are spent
  });

  // The loser of the round that just ended starts the next one. On a tie, alternate.
  const nextStarter = winnerIdx !== null ? other(winnerIdx) : other(state.roundStarter);
  state.roundStarter = nextStarter;
  state.active = nextStarter;
  state.roundNumber++;
  state.turnNo = (state.turnNo || 1) + 1;

  [0, 1].forEach(pi => {
    const p = state.players[pi];
    for (let i = 0; i < 5; i++) drawOne(pi);
    if (pi === 0) setTimeout(() => sfx('deal'), 1500);
    p.hand.forEach(inst => { inst.drawnTurn = undefined; }); // the opening hand isn't "drawn this turn"
    p.cardsPlayedThisTurn = 0;
    p.hasDrawnThisTurn = false;
  });

  state.pendingReveal = state.active;
  fire('turnStart', { owner: state.active });
  runQueue();
  render();
}

function formatAbility(text) {

// The one card renderer, used everywhere — lane, hand, and the enlarged
// inspect modal all show the exact same full detail, just at different
// display sizes. Nothing is hidden at "compact" size; there's no compact size.
// Font sizes start as a rough guess (below), then autoFitCardText() shrinks
// each one to actually fit its box — same idea as the print compositor's
// own fit_text_font(), just done live in the browser instead of at print time.
function establishedCardHtml(cardId, opts) {
  opts = opts || {};

  const powerColor = card.type === 'Location' ? 'oklch(0.44 0.12 220)' : 'oklch(0.50 0.15 45)';
  const w = opts.width || 240; // px — the width this card is expected to render at

  let html = '<div class="est-card" style="aspect-ratio:' + L.aspect + '">';
  html += '<div class="est-box est-art" style="' + boxStyle(L.art) + (art ? 'background-image:url(' + art + ')' : '') + '">' + (art ? '' : '<div class="placeholder-art"></div>') + '</div>';
  html += '<img class="est-mask" src="' + mask + '">';
  html += '<div class="est-box est-name est-fit-single" style="' + boxStyle(L.name) + ';font-size:' + (w * 0.072) + 'px">' + esc(card.name) + '</div>';
  if (L.power) html += '<div class="est-box est-power" style="' + boxStyle(L.power) + ';color:' + powerColor + ';font-size:' + (w * 0.10) + 'px">' + powerVal + '</div>';
  html += '<div class="est-box est-subtype est-fit-single" style="' + boxStyle(L.subtype) + ';font-size:' + (w * 0.046) + 'px">' + esc((card.subtype || card.type).toUpperCase()) + '</div>';
  html += '<div class="est-box est-ability est-fit-multi" style="' + boxStyle(L.ability) + ';font-size:' + (w * 0.046) + 'px">' + formatAbility(card.ability) + '</div>';
  if (card.flavor) html += '<div class="est-box est-flavor est-fit-multi" style="' + boxStyle(L.flavor) + ';font-size:' + (w * 0.038) + 'px">' + esc(card.flavor) + '</div>';
  html += '<div class="est-box est-legalL" style="' + boxStyle(L.legalL) + ';font-size:' + (w * 0.034) + 'px">#' + esc(card.id) + '</div>';
  if (gem) html += '<div class="est-box" style="' + boxStyle(L.gem) + '"><img class="est-gem" src="' + gem + '"></div>';
  html += '</div>';

// Shrinks one text element's font-size, in whole px steps, until its content
// actually fits its box — exactly the compositor's own approach, just
// measured live against the real rendered box instead of computed offline.
// "single" = one line (name/subtype): fits by width. "multi" = wraps
// (ability/flavor): fits by height.
function fitTextToBox(el, mode) {
  if (!el) return;
  let size = parseFloat(el.style.fontSize) || 16;
  const minSize = 6;
  const overflows = () => mode === 'single' ? el.scrollWidth > el.clientWidth + 1 : el.scrollHeight > el.clientHeight + 1;
  let guard = 0;
  while (size > minSize && overflows() && guard < 40) {
    // Proportional step based on how far over the box we currently are —
    // converges in a few iterations on a big gap, falls back to fine 1px
    // steps once close, rather than a flat "always -1px" (which can run out
    // of iterations before reaching the target on a large size difference).
    const ratio = mode === 'single' ? el.clientWidth / el.scrollWidth : el.clientHeight / el.scrollHeight;
    const step = Math.max(1, Math.min(size * (1 - ratio), size * 0.2));
    size = Math.max(minSize, size - step);
    el.style.fontSize = size + 'px';
    guard++;
  }
}

function autoFitCardText(root) {
  (root || document).querySelectorAll('.est-fit-single').forEach(el => fitTextToBox(el, 'single'));
  (root || document).querySelectorAll('.est-fit-multi').forEach(el => fitTextToBox(el, 'multi'));
}

function adjustPick(playerNum, cardId, delta) {
  const picks = playerNum === 1 ? builder.p1Picks : builder.p2Picks;
  const card = CARD_BY_ID[cardId];
  const cap = maxCopiesFor(card);
  const current = picks[cardId] || 0;
  const next = Math.max(0, Math.min(cap, current + delta));
  if (next === 0) delete picks[cardId]; else picks[cardId] = next;
  renderSetup();
}

function clearDeckSelection(playerNum) {
